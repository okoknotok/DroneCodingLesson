<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚁 無人機指令營 — ScratchJr 風格</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      /* ScratchJr 風格顏色 */
      --motion-blue: #5B9BD5;
      --event-yellow: #FFD966;
      --control-orange: #FF9F45;
      --end-red: #EF6053;
      --bg-dark: #1a1a2e;
      --bg-panel: #16213e;
      --text-light: #e8e8e8;
      --grid-line: rgba(255,255,255,0.08);
    }
    
    body {
      font-family: 'Nunito', 'Nunito', sans-serif;
      background: var(--bg-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }
    
    /* ===== 頂部預覽區 ===== */
    #top-bar {
      height: 50px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      color: white;
    }
    #level-title {
      font-size: 18px;
      font-weight: 800;
    }
    #hint-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      border-radius: 20px;
      padding: 8px 16px;
      color: white;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    #hint-btn:hover { background: rgba(255,255,255,0.35); }
    
    /* ===== 遊戲舞台區 ===== */
    #stage {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    
    /* 客厅背景 */
    #living-room {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, 
        #87CEEB 0%, 
        #87CEEB 40%,
        #8B7355 40%,
        #8B7355 42%,
        #DEB887 42%,
        #DEB887 100%
      );
    }
    
    /* 牆壁裝飾 */
    .wall-deco {
      position: absolute;
      background: #F5DEB3;
      border: 4px solid #8B7355;
      border-radius: 4px;
    }
    .wall-deco.frame1 {
      width: 80px; height: 60px;
      top: 8%; left: 10%;
      background: linear-gradient(135deg, #FFB6C1 0%, #FFA07A 100%);
    }
    .wall-deco.frame2 {
      width: 60px; height: 80px;
      top: 5%; right: 15%;
      background: linear-gradient(135deg, #98FB98 0%, #90EE90 100%);
    }
    .wall-deco.clock {
      width: 50px; height: 50px;
      top: 8%; left: 45%;
      background: white;
      border-radius: 50%;
      border: 4px solid #654321;
    }
    
    /* 窗戶 */
    .window {
      position: absolute;
      width: 120px; height: 90px;
      top: 3%; right: 30%;
      background: linear-gradient(180deg, #87CEEB 0%, #B0E0E6 100%);
      border: 6px solid #654321;
      border-radius: 4px;
    }
    .window::after {
      content: '';
      position: absolute;
      width: 2px; height: 100%;
      background: #654321;
      left: 50%;
      transform: translateX(-50%);
    }
    .window::before {
      content: '';
      position: absolute;
      width: 100%; height: 2px;
      background: #654321;
      top: 50%;
      transform: translateY(-50%);
    }
    
    /* 家具障礙物 */
    .furniture {
      position: absolute;
      border-radius: 6px;
    }
    .furniture.sofa {
      width: 140px; height: 50px;
      bottom: 42%; left: 5%;
      background: linear-gradient(180deg, #CD853F 0%, #8B4513 100%);
      border: 3px solid #654321;
    }
    .furniture.table {
      width: 100px; height: 45px;
      bottom: 42%; right: 10%;
      background: linear-gradient(180deg, #DEB887 0%, #D2691E 100%);
      border: 3px solid #8B4513;
      border-radius: 8px;
    }
    .furniture.plant {
      width: 40px; height: 60px;
      bottom: 42%; left: 25%;
      background: linear-gradient(180deg, #228B22 0%, #006400 100%);
      border-radius: 50% 50% 10% 10%;
    }
    
    /* 地板格仔 */
    #floor-grid {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 58%;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-template-rows: repeat(6, 1fr);
    }
    .floor-tile {
      border: 1px solid rgba(139, 115, 85, 0.3);
    }
    .floor-tile:nth-child(odd) {
      background: rgba(222, 184, 135, 0.5);
    }
    .floor-tile:nth-child(even) {
      background: rgba(210, 180, 140, 0.5);
    }
    
    /* 終點標記 */
    #goal-zone {
      position: absolute;
      width: 60px; height: 60px;
      border: 4px dashed #43a047;
      border-radius: 8px;
      background: rgba(67, 160, 71, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      animation: goalPulse 1.5s infinite;
    }
    @keyframes goalPulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
    }
    
    /* 無人機 */
    #drone {
      position: absolute;
      width: 50px; height: 50px;
      transition: left 0.5s ease-out, bottom 0.5s ease-out, transform 0.3s;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #drone-body {
      width: 40px; height: 25px;
      background: linear-gradient(135deg, #4fc3f7 0%, #29b6f6 100%);
      border-radius: 8px;
      position: relative;
      box-shadow: 0 4px 15px rgba(79, 195, 247, 0.4);
    }
    .drone-prop {
      position: absolute;
      width: 20px; height: 4px;
      background: rgba(200, 230, 255, 0.8);
      border-radius: 2px;
      top: 50%;
      transform: translateY(-50%);
    }
    .drone-prop.left { left: -8px; }
    .drone-prop.right { right: -8px; }
    #drone.flying #drone-body {
      animation: droneHover 0.5s infinite alternate;
    }
    @keyframes droneHover {
      from { transform: translateY(0); }
      to { transform: translateY(-3px); }
    }
    
    /* LED 表情 */
    #drone-expr {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }
    
    /* 起飛/着陸動畫 */
    #drone.takeoff-anim {
      animation: takeoffAnim 0.6s ease-out;
    }
    @keyframes takeoffAnim {
      0% { transform: scale(1); }
      50% { transform: scale(1.2) translateY(-20px); }
      100% { transform: scale(1); }
    }
    #drone.land-anim {
      animation: landAnim 0.6s ease-in;
    }
    @keyframes landAnim {
      0% { transform: scale(1); }
      50% { transform: scale(0.9) translateY(10px); }
      100% { transform: scale(1); }
    }
    
    /* 終點動畫 */
    #win-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      backdrop-filter: blur(5px);
    }
    #win-overlay.show { display: flex; }
    #win-overlay h1 {
      font-size: 64px;
      margin-bottom: 10px;
      animation: bounceIn 0.5s ease-out;
    }
    @keyframes bounceIn {
      0% { transform: scale(0); }
      60% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    #win-overlay p { color: #ccc; font-size: 20px; margin-bottom: 20px; }
    #next-btn {
      padding: 12px 30px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 25px;
      color: white;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s;
    }
    #next-btn:hover { transform: scale(1.05); }
    
    /* ===== 底部積木區 ===== */
    #block-area {
      height: 280px;
      background: var(--bg-panel);
      border-top: 3px solid var(--motion-blue);
      display: flex;
      flex-direction: column;
    }
    
    /* 積木面板 */
    #block-palette {
      display: flex;
      gap: 8px;
      padding: 10px 15px;
      background: rgba(0,0,0,0.2);
      overflow-x: auto;
      flex-wrap: wrap;
    }
    .palette-category {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .category-label {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      color: white;
    }
    .category-label.motion { background: var(--motion-blue); }
    .category-label.control { background: var(--control-orange); }
    .category-label.event { background: var(--event-yellow); color: #333; }
    .category-label.end { background: var(--end-red); }
    
    .block {
      width: 52px; height: 52px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      transition: transform 0.1s, box-shadow 0.1s;
      position: relative;
      font-size: 26px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.3);
    }
    .block:hover { transform: scale(1.08); box-shadow: 0 6px 16px rgba(0,0,0,0.4); }
    .block:active { transform: scale(0.95); cursor: grabbing; }
    .block.motion { background: linear-gradient(135deg, #5B9BD5 0%, #4177B8 100%); }
    .block.control { background: linear-gradient(135deg, #FF9F45 0%, #E8890C 100%); }
    .block.event { background: linear-gradient(135deg, #FFD966 0%, #F5C630 100%); }
    .block.end { background: linear-gradient(135deg, #EF6053 0%, #D84A3A 100%); }
    
    /* 工作區 */
    #workspace-section {
      flex: 1;
      display: flex;
      padding: 8px 15px;
      gap: 10px;
    }
    #program-workspace {
      flex: 1;
      background: rgba(255,255,255,0.04);
      border: 2px dashed rgba(255,255,255,0.15);
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 15px;
      min-height: 90px;
      overflow-x: auto;
    }
    #program-workspace.drag-over {
      border-color: var(--motion-blue);
      background: rgba(91, 155, 213, 0.1);
    }
    
    /* 已添加的積木 */
    .program-block {
      min-width: 48px; height: 48px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      position: relative;
      animation: blockIn 0.2s ease-out;
      box-shadow: 0 3px 8px rgba(0,0,0,0.3);
    }
    @keyframes blockIn {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .program-block.motion { background: linear-gradient(135deg, #5B9BD5 0%, #4177B8 100%); }
    .program-block.control { background: linear-gradient(135deg, #FF9F45 0%, #E8890C 100%); }
    .program-block.event { background: linear-gradient(135deg, #FFD966 0%, #F5C630 100%); }
    .program-block.end { background: linear-gradient(135deg, #EF6053 0%, #D84A3A 100%); }
    
    /* 刪除按鈕 */
    .program-block .del {
      position: absolute;
      top: -6px; right: -6px;
      width: 18px; height: 18px;
      background: #ef4444;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: white;
      font-weight: 700;
    }
    .program-block:hover .del { display: flex; }
    
    /* 參數選擇 (重複次數) */
    .block-param {
      position: absolute;
      bottom: -4px;
      right: -4px;
      background: white;
      border-radius: 10px;
      padding: 2px 5px;
      font-size: 10px;
      font-weight: 700;
      color: #333;
      cursor: pointer;
    }
    
    /* 控制按鈕 */
    #controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .ctrl-btn {
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ctrl-btn:hover { transform: scale(1.03); }
    .ctrl-btn:active { transform: scale(0.97); }
    #green-btn {
      background: linear-gradient(135deg, #4CAF50 0%, #388E3C 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
    }
    #clear-btn {
      background: rgba(255,255,255,0.1);
      color: #ccc;
    }
    #reset-btn {
      background: rgba(239, 68, 68, 0.2);
      color: #ef9a9a;
    }
    
    /* 狀態顯示 */
    #status-bar {
      padding: 6px 15px;
      background: rgba(0,0,0,0.3);
      color: #aaa;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
    }
    #status-bar.success { background: rgba(76, 175, 80, 0.2); color: #81c784; }
    #status-bar.fail { background: rgba(239, 68, 68, 0.2); color: #ef9a9a; }
    #status-bar.running { background: rgba(91, 155, 213, 0.2); color: #90caf9; }
    
    /* 提示彈窗 */
    #hint-popup {
      position: absolute;
      bottom: 300px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(102, 126, 234, 0.95);
      padding: 12px 20px;
      border-radius: 12px;
      color: white;
      font-size: 14px;
      display: none;
      z-index: 150;
      max-width: 300px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    #hint-popup.show { display: block; }
    #hint-popup::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 8px solid transparent;
      border-top-color: rgba(102, 126, 234, 0.95);
    }
  </style>
</head>
<body>
  <!-- 頂部 bar -->
  <div id="top-bar">
    <div id="level-title">🏠 第一關：客廳任務</div>
    <button id="hint-btn" onclick="toggleHint()">💡 提示</button>
  </div>
  
  <!-- 遊戲舞台 -->
  <div id="stage">
    <div id="living-room">
      <!-- 牆壁裝飾 -->
      <div class="wall-deco frame1"></div>
      <div class="wall-deco frame2"></div>
      <div class="wall-deco clock"></div>
      <div class="window"></div>
      
      <!-- 家具障礙物 -->
      <div class="furniture sofa"></div>
      <div class="furniture table"></div>
      <div class="furniture plant"></div>
      
      <!-- 地板格仔 -->
      <div id="floor-grid"></div>
    </div>
    
    <!-- 終點 -->
    <div id="goal-zone" style="bottom: 32%; left: 80%;">🏁</div>
    
    <!-- 無人機 -->
    <div id="drone" style="bottom: 35%; left: 10%;">
      <div id="drone-expr">😴</div>
      <div id="drone-body">
        <div class="drone-prop left"></div>
        <div class="drone-prop right"></div>
      </div>
    </div>
    
    <!-- 過關 overlay -->
    <div id="win-overlay">
      <h1>🎉</h1>
      <p id="win-msg">過關了！太棒了！</p>
      <button id="next-btn" onclick="nextLevel()">下一關 →</button>
    </div>
    
    <!-- 提示 -->
    <div id="hint-popup">🎯 目標：操控無人機到達 🏁 終點！<br><br>👉 試試：起飛 → 前進 → 前進 → 前進 → 着陸</div>
  </div>
  
  <!-- 積木區 -->
  <div id="block-area">
    <!-- 積木面板 -->
    <div id="block-palette">
      <div class="palette-category">
        <span class="category-label motion">動</span>
      </div>
      <div class="block motion" draggable="true" data-type="takeoff" data-icon="🚀">🚀</div>
      <div class="block motion" draggable="true" data-type="forward" data-icon="⬆️">⬆️</div>
      <div class="block motion" draggable="true" data-type="backward" data-icon="⬇️">⬇️</div>
      <div class="block motion" draggable="true" data-type="left" data-icon="↩️">↩️</div>
      <div class="block motion" draggable="true" data-type="right" data-icon="↪️">↪️</div>
      
      <div class="palette-category">
        <span class="category-label control">控</span>
      </div>
      <div class="block control" draggable="true" data-type="repeat" data-icon="🔄">🔄</div>
      <div class="block control" draggable="true" data-type="wait" data-icon="⏱️">⏱️</div>
      
      <div class="palette-category">
        <span class="category-label event">事</span>
      </div>
      <div class="block event" draggable="true" data-type="start" data-icon="🟢">🟢</div>
      
      <div class="palette-category">
        <span class="category-label end">終</span>
      </div>
      <div class="block end" draggable="true" data-type="land" data-icon="🛬">🛬</div>
    </div>
    
    <!-- 工作區 -->
    <div id="workspace-section">
      <div id="program-workspace"></div>
      
      <div id="controls">
        <button class="ctrl-btn" id="green-btn" onclick="runProgram()">
          🟢 執行
        </button>
        <button class="ctrl-btn" id="clear-btn" onclick="clearProgram()">
          🗑️ 清除
        </button>
        <button class="ctrl-btn" id="reset-btn" onclick="resetDrone()">
          🔄 重置
        </button>
      </div>
    </div>
    
    <!-- 狀態列 -->
    <div id="status-bar">
      <span id="block-count">0 個積木</span>
      <span id="level-info">Level 1</span>
    </div>
  </div>

  <script>
    // === 遊戲狀態 ===
    let program = [];
    let isRunning = false;
    let dronePos = { x: 10, y: 35 }; // 百分比
    let droneDirection = 0; // 0=右, 90=上, 180=左, 270=下
    let droneFlying = false;
    
    // === 關卡數據 ===
    const LEVELS = [
      {
        name: "第一關：客廳任務",
        hint: "🎯 目標：操控無人機到達 🏁 終點！\n\n👉 試試：起飛 → 前進 → 前進 → 前進 → 着陸",
        start: { x: 10, y: 35 },
        goal: { x: 80, y: 32 },
        obstacles: []
      },
      {
        name: "第二關：繞過障礙",
        hint: "⚠️ 前面有障礙物！需要轉向繞路",
        start: { x: 10, y: 35 },
        goal: { x: 85, y: 55 },
        obstacles: [
          { x: 45, y: 35, w: 8, h: 15 }
        ]
      },
      {
        name: "第三關：長距離挑戰",
        hint: "🏁 終點比較遠，要用更多前進積木！",
        start: { x: 5, y: 60 },
        goal: { x: 90, y: 60 },
        obstacles: []
      }
    ];
    let currentLevel = 0;
    
    // === 初始化地板格仔 ===
    function initFloorGrid() {
      const grid = document.getElementById('floor-grid');
      for (let i = 0; i < 72; i++) {
        const tile = document.createElement('div');
        tile.className = 'floor-tile';
        grid.appendChild(tile);
      }
    }
    
    // === 積木拖放 ===
    const palette = document.getElementById('block-palette');
    const workspace = document.getElementById('program-workspace');
    
    // 阻止默認行為
    palette.addEventListener('dragstart', e => {
      if (e.target.classList.contains('block')) {
        e.dataTransfer.setData('type', e.target.dataset.type);
        e.dataTransfer.setData('icon', e.target.dataset.icon);
        e.dataTransfer.setData('class', e.target.className);
      }
    });
    
    workspace.addEventListener('dragover', e => {
      e.preventDefault();
      workspace.classList.add('drag-over');
    });
    
    workspace.addEventListener('dragleave', () => {
      workspace.classList.remove('drag-over');
    });
    
    workspace.addEventListener('drop', e => {
      e.preventDefault();
      workspace.classList.remove('drag-over');
      
      const type = e.dataTransfer.getData('type');
      const icon = e.dataTransfer.getData('icon');
      const cls = e.dataTransfer.getData('class');
      
      if (type) {
        addBlock(type, icon, cls);
      }
    });
    
    // === 添加積木到工作區 ===
    function addBlock(type, icon, cls) {
      const block = document.createElement('div');
      block.className = `program-block ${cls.split(' ')[1]}`;
      block.dataset.type = type;
      block.innerHTML = icon;
      
      // 刪除按鈕
      const del = document.createElement('span');
      del.className = 'del';
      del.innerHTML = '×';
      del.onclick = (e) => {
        e.stopPropagation();
        block.remove();
        updateBlockCount();
      };
      block.appendChild(del);
      
      // 重複積木需要參數
      if (type === 'repeat') {
        const param = document.createElement('span');
        param.className = 'block-param';
        param.innerHTML = '×3';
        param.onclick = (e) => {
          e.stopPropagation();
          // 簡單循環：變換次數
          let times = parseInt(param.innerHTML.replace('×', '')) || 1;
          times = times >= 5 ? 1 : times + 1;
          param.innerHTML = `×${times}`;
        };
        block.appendChild(param);
      }
      
      // 點擊執行（單步）
      block.onclick = () => {
        if (!isRunning) {
          executeSingleBlock(type);
        }
      };
      
      workspace.appendChild(block);
      updateBlockCount();
      
      // 播放音效
      playBlockSound();
    }
    
    function updateBlockCount() {
      const blocks = workspace.querySelectorAll('.program-block');
      document.getElementById('block-count').textContent = `${blocks.length} 個積木`;
    }
    
    // === 音效 ===
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playBlockSound() {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = 800;
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    }
    
    function playSuccessSound() {
      [523, 659, 784].forEach((freq, i) => {
        setTimeout(() => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);
        }, i * 150);
      });
    }
    
    function playFailSound() {
      [300, 200].forEach((freq, i) => {
        setTimeout(() => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.frequency.value = freq;
          osc.type = 'square';
          gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.2);
        }, i * 100);
      });
    }
    
    // === 執行單個積木 ===
    function executeSingleBlock(type) {
      const drone = document.getElementById('drone');
      const expr = document.getElementById('drone-expr');
      
      switch(type) {
        case 'takeoff':
          droneFlying = true;
          drone.classList.add('flying', 'takeoff-anim');
          expr.textContent = '😀';
          setTimeout(() => drone.classList.remove('takeoff-anim'), 600);
          break;
          
        case 'forward':
          if (droneFlying) {
            dronePos.x += 8;
            expr.textContent = '😎';
          }
          break;
          
        case 'backward':
          if (droneFlying) {
            dronePos.x -= 8;
            expr.textContent = '😎';
          }
          break;
          
        case 'left':
          if (droneFlying) {
            droneDirection = (droneDirection + 90) % 360;
            drone.style.transform = `rotate(-90deg)`;
            expr.textContent = '😉';
          }
          break;
          
        case 'right':
          if (droneFlying) {
            droneDirection = (droneDirection - 90 + 360) % 360;
            drone.style.transform = `rotate(90deg)`;
            expr.textContent = '😉';
          }
          break;
          
        case 'land':
          droneFlying = false;
          drone.classList.remove('flying');
          drone.style.transform = '';
          expr.textContent = '🥰';
          break;
          
        case 'wait':
          // 等待在runProgram中處理
          break;
          
        case 'repeat':
          // 重複在runProgram中處理
          break;
      }
      
      // 根據方向調整
      if (type === 'forward' || type === 'backward') {
        if (droneDirection === 90) dronePos.y -= 5;
        if (droneDirection === 270) dronePos.y += 5;
      }
      
      updateDronePosition();
      
      // 檢查是否到達終點
      setTimeout(checkGoal, 400);
    }
    
    function updateDronePosition() {
      const drone = document.getElementById('drone');
      drone.style.left = `${dronePos.x}%`;
      drone.style.bottom = `${dronePos.y}%`;
    }
    
    // === 執行整個程序 ===
    async function runProgram() {
      if (isRunning) return;
      
      const blocks = workspace.querySelectorAll('.program-block');
      if (blocks.length === 0) return;
      
      isRunning = true;
      document.getElementById('status-bar').className = 'running';
      document.getElementById('status-bar').innerHTML = '<span>🔄 執行中...</span>';
      
      // 初始化無人機狀態
      droneFlying = false;
      droneDirection = 0;
      document.getElementById('drone').style.transform = '';
      
      for (let i = 0; i < blocks.length; i++) {
        const block = blocks[i];
        const type = block.dataset.type;
        
        // 高亮當前積木
        block.style.boxShadow = '0 0 0 3px white, 0 0 20px rgba(255,255,255,0.5)';
        
        // 執行
        await new Promise(resolve => {
          executeSingleBlock(type);
          setTimeout(resolve, 500);
        });
        
        // 處理重複
        if (type === 'repeat') {
          const param = block.querySelector('.block-param');
          const times = parseInt(param?.innerHTML.replace('×', '')) || 1;
          // 重複執行前一個積木
          if (i > 0) {
            const prevType = blocks[i-1].dataset.type;
            for (let j = 0; j < times - 1; j++) {
              await new Promise(r => setTimeout(r, 300));
              executeSingleBlock(prevType);
            }
          }
        }
        
        // 處理等待
        if (type === 'wait') {
          await new Promise(r => setTimeout(r, 800));
        }
        
        // 清除高亮
        block.style.boxShadow = '';
      }
      
      isRunning = false;
      
      // 檢查是否成功
      if (checkGoalSimple()) {
        showWin();
      } else if (droneFlying) {
        document.getElementById('status-bar').className = 'fail';
        document.getElementById('status-bar').innerHTML = '<span>❌ 未到達終點，再試一次！</span>';
        playFailSound();
      }
    }
    
    function checkGoal() {
      if (checkGoalSimple()) {
        showWin();
      }
    }
    
    function checkGoalSimple() {
      const goal = LEVELS[currentLevel].goal;
      const tolerance = 10;
      return Math.abs(dronePos.x - goal.x) < tolerance && 
             Math.abs(dronePos.y - goal.y) < tolerance;
    }
    
    function showWin() {
      playSuccessSound();
      document.getElementById('status-bar').className = 'success';
      document.getElementById('status-bar').innerHTML = '<span>🎉 過關了！</span>';
      document.getElementById('win-overlay').classList.add('show');
      document.getElementById('win-msg').textContent = 
        currentLevel < LEVELS.length - 1 ? '太棒了！準備好挑戰下一關？' : '恭喜你完成所有關卡！🎊';
      document.getElementById('next-btn').textContent = 
        currentLevel < LEVELS.length - 1 ? '下一關 →' : '再玩一次';
    }
    
    function nextLevel() {
      document.getElementById('win-overlay').classList.remove('show');
      if (currentLevel < LEVELS.length - 1) {
        currentLevel++;
      } else {
        currentLevel = 0;
      }
      loadLevel(currentLevel);
    }
    
    function loadLevel(index) {
      const level = LEVELS[index];
      document.getElementById('level-title').textContent = level.name;
      document.getElementById('hint-popup').textContent = level.hint;
      document.getElementById('level-info').textContent = `Level ${index + 1}`;
      
      dronePos = { ...level.start };
      droneDirection = 0;
      droneFlying = false;
      
      const drone = document.getElementById('drone');
      drone.classList.remove('flying');
      drone.style.transform = '';
      document.getElementById('drone-expr').textContent = '😴';
      updateDronePosition();
      
      document.getElementById('goal-zone').style.left = `${level.goal.x}%`;
      document.getElementById('goal-zone').style.bottom = `${level.goal.y}%`;
      document.getElementById('goal-zone').style.left = `${level.goal.x}%`;
      
      document.getElementById('status-bar').className = '';
      document.getElementById('status-bar').innerHTML = '<span id="block-count">0 個積木</span><span>Level ' + (index + 1) + '</span>';
    }
    
    // === 清除程序 ===
    function clearProgram() {
      workspace.innerHTML = '';
      updateBlockCount();
    }
    
    // === 重置無人機 ===
    function resetDrone() {
      const level = LEVELS[currentLevel];
      dronePos = { ...level.start };
      droneDirection = 0;
      droneFlying = false;
      
      const drone = document.getElementById('drone');
      drone.classList.remove('flying');
      drone.style.transform = '';
      document.getElementById('drone-expr').textContent = '😴';
      updateDronePosition();
      
      document.getElementById('status-bar').className = '';
      document.getElementById('status-bar').innerHTML = '<span id="block-count">0 個積木</span><span>Level ' + (currentLevel + 1) + '</span>';
    }
    
    // === 提示 ===
    function toggleHint() {
      const popup = document.getElementById('hint-popup');
      popup.classList.toggle('show');
    }
    
    // === 初始化 ===
    initFloorGrid();
    loadLevel(0);
    
    // 點擊其他地方關閉提示
    document.addEventListener('click', e => {
      if (!e.target.closest('#hint-btn') && !e.target.closest('#hint-popup')) {
        document.getElementById('hint-popup').classList.remove('show');
      }
    });
    
    // 音頻初始化（需要用戶交互）
    document.body.addEventListener('click', () => {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }, { once: true });
  </script>
</body>
