<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚁 無人機指令營 — 專業版</title>
  
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script src="https://unpkg.com/blockly@11.0.0/blockly.min.js"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --motion-blue: #4A90D9;
      --looks-purple: #9B59B6;
      --control-orange: #F5A623;
      --event-yellow: #F8E71C;
      --end-red: #F56C6C;
      --bg-dark: #0d1421;
      --bg-panel: #0a1220;
      --accent: #667eea;
      --success: #50C878;
    }
    
    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }
    
    #top-bar {
      height: 64px;
      background: linear-gradient(135deg, var(--accent) 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      color: white;
      box-shadow: 0 4px 25px rgba(0,0,0,0.4);
      z-index: 100;
    }
    #logo-area { display: flex; align-items: center; gap: 12px; }
    #logo { font-size: 28px; }
    #level-title { font-size: 20px; font-weight: 800; }
    #level-selector { display: flex; gap: 8px; }
    .level-btn {
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.15);
      border: 2px solid transparent;
      border-radius: 10px;
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .level-btn:hover { background: rgba(255,255,255,0.25); }
    .level-btn.active { border-color: white; background: rgba(255,255,255,0.3); }
    .level-btn.locked { opacity: 0.4; cursor: not-allowed; }
    .level-btn.completed { background: var(--success); }
    
    #top-btns { display: flex; gap: 10px; }
    .top-btn {
      padding: 8px 18px;
      background: rgba(255,255,255,0.12);
      border: none;
      border-radius: 20px;
      color: white;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .top-btn:hover { background: rgba(255,255,255,0.25); transform: translateY(-1px); }
    .top-btn.solution { background: rgba(245, 166, 35, 0.3); }
    .top-btn.theme-toggle { font-size: 16px; }
    
    #main-content { flex: 1; display: flex; overflow: hidden; }
    
    #stage-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      min-width: 0;
    }
    
    #stage-header {
      height: 50px;
      padding: 0 16px;
      background: rgba(0,0,0,0.4);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    #stage-header h3 { color: var(--motion-blue); font-size: 14px; display: flex; align-items: center; gap: 8px; }
    #camera-controls { display: flex; gap: 6px; align-items: center; }
    .cam-btn {
      width: 32px; height: 32px;
      background: rgba(255,255,255,0.06);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .cam-btn:hover { background: rgba(255,255,255,0.15); }
    #cam-label { color: #666; font-size: 11px; padding: 0 6px; }
    
    #canvas-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    #renderCanvas { width: 100%; height: 100%; touch-action: none; display: block; }
    
    #overlay-ui {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 20;
    }
    .info-card {
      background: rgba(10, 18, 32, 0.92);
      backdrop-filter: blur(12px);
      border-radius: 14px;
      padding: 12px 16px;
      border: 1px solid rgba(255,255,255,0.08);
      min-width: 140px;
    }
    .info-card .lbl { color: #666; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .info-card .val { color: white; font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
    .info-card.success { border-color: var(--success); }
    .info-card .val.success { color: var(--success); }
    
    /* ===== Tello Telemetry HUD ===== */
    #tello-hud {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(10, 18, 32, 0.85);
      border-radius: 12px;
      padding: 12px 14px;
      border: 1px solid rgba(79, 195, 247, 0.3);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      z-index: 50;
      min-width: 160px;
      backdrop-filter: blur(8px);
    }
    #tello-hud h4 {
      color: #4fc3f7;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      text-align: center;
      border-bottom: 1px solid rgba(79, 195, 247, 0.2);
      padding-bottom: 6px;
    }
    .tello-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      font-size: 13px;
      color: #ccc;
    }
    .tello-row .icon { font-size: 14px; }
    .tello-row .label { color: #888; font-size: 11px; }
    .tello-row .value { font-weight: 700; color: #fff; font-family: 'Courier New', monospace; }
    .tello-row.battery .value { color: #50C878; }
    .tello-row.battery.warning .value { color: #F5A623; }
    .tello-row.battery.critical .value { color: #F56C6C; animation: blink 0.8s infinite; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    .tello-row.battery.critical { animation: rowBlink 0.8s infinite; }
    @keyframes rowBlink { 0%,100% { background: transparent; } 50% { background: rgba(245, 108, 108, 0.1); } }
    .signal-bars { display: flex; gap: 2px; }
    .signal-bar { width: 4px; border-radius: 1px; background: #333; }
    .signal-bar.active { background: #50C878; }
    .signal-bar:nth-child(1) { height: 6px; }
    .signal-bar:nth-child(2) { height: 9px; }
    .signal-bar:nth-child(3) { height: 12px; }
    .signal-bar:nth-child(4) { height: 15px; }
    .signal-bar:nth-child(5) { height: 18px; }
    .tello-divider { border: none; border-top: 1px solid rgba(255,255,255,0.05); margin: 6px 0; }
    
    /* ===== Onboarding Tutorial ===== */
    #tutorial-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      display: none;
      pointer-events: none;
    }
    #tutorial-overlay.active { display: block; }
    #tutorial-spotlight {
      position: absolute;
      border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.7);
      transition: all 0.4s ease;
      z-index: 1001;
      pointer-events: auto;
      cursor: pointer;
    }
    #tutorial-tooltip {
      position: absolute;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 600;
      max-width: 220px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      z-index: 1002;
      line-height: 1.5;
    }
    #tutorial-tooltip::before {
      content: '';
      position: absolute;
      width: 0; height: 0;
      border: 10px solid transparent;
    }
    #tutorial-tooltip.top::before { bottom: -20px; left: 50%; transform: translateX(-50%); border-top-color: #667eea; }
    #tutorial-tooltip.bottom::before { top: -20px; left: 50%; transform: translateX(-50%); border-bottom-color: #667eea; }
    #tutorial-tooltip.left::before { right: -20px; top: 50%; transform: translateY(-50%); border-left-color: #667eea; }
    #tutorial-tooltip.right::before { left: -20px; top: 50%; transform: translateY(-50%); border-right-color: #667eea; }
    #tutorial-arrow {
      position: absolute;
      font-size: 28px;
      z-index: 1003;
      animation: bounce 0.6s infinite alternate;
    }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-8px); } }
    #tutorial-skip {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: #ccc;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      z-index: 1004;
      pointer-events: auto;
    }
    #tutorial-skip:hover { background: rgba(255,255,255,0.25); color: white; }
    #tutorial-progress {
      position: absolute;
      bottom: 20px;
      left: 20px;
      display: flex;
      gap: 6px;
      z-index: 1004;
    }
    .tutorial-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
    }
    .tutorial-dot.active { background: #667eea; }
    .tutorial-dot.done { background: #50C878; }
    
    #goal-hud {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(67, 160, 71, 0.9);
      padding: 10px 20px;
      border-radius: 25px;
      color: white;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(67, 160, 71, 0.4);
      animation: goalPulse 1.5s infinite;
    }
    @keyframes goalPulse {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.03); }
    }
    
    #win-modal {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }
    #win-modal.show { display: flex; }
    #win-stars { font-size: 70px; margin-bottom: 15px; animation: starSpin 0.8s ease-out; }
    @keyframes starSpin {
      0% { transform: scale(0) rotate(-180deg); opacity: 0; }
      60% { transform: scale(1.3) rotate(20deg); }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }
    #win-modal h2 { color: white; font-size: 42px; margin-bottom: 8px; }
    #win-modal p { color: #aaa; font-size: 20px; margin-bottom: 30px; }
    #win-buttons { display: flex; gap: 12px; }
    .win-btn {
      padding: 14px 32px;
      border: none;
      border-radius: 25px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .win-btn.primary { background: linear-gradient(135deg, var(--accent), #764ba2); color: white; box-shadow: 0 6px 25px rgba(102, 126, 234, 0.5); }
    .win-btn.secondary { background: rgba(255,255,255,0.1); color: white; }
    .win-btn:hover { transform: scale(1.05); }
    
    #hint-card {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(102, 126, 234, 0.95);
      padding: 16px 24px;
      border-radius: 16px;
      color: white;
      font-size: 15px;
      max-width: 400px;
      text-align: center;
      display: none;
      z-index: 50;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      line-height: 1.6;
    }
    #hint-card.show { display: block; }
    #hint-card::after { content: ''; position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%); border: 10px solid transparent; border-top-color: rgba(102, 126, 234, 0.95); }
    
    #blockly-panel {
      width: 480px;
      min-width: 400px;
      background: var(--bg-panel);
      display: flex;
      flex-direction: column;
      border-left: 2px solid rgba(255,255,255,0.05);
    }
    
    #blockly-header {
      height: 56px;
      padding: 0 16px;
      background: rgba(0,0,0,0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    #blockly-header h3 { color: var(--accent); font-size: 16px; font-weight: 700; }
    #header-btns { display: flex; gap: 10px; align-items: center; }
    #block-counter { color: #666; font-size: 13px; padding: 6px 12px; background: rgba(255,255,255,0.05); border-radius: 15px; }
    #run-btn {
      padding: 10px 24px;
      background: linear-gradient(135deg, #50C878, #3cb371);
      border: none;
      border-radius: 22px;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(80, 200, 120, 0.35);
    }
    #run-btn:hover { transform: scale(1.04); }
    #run-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    #run-btn.running { background: linear-gradient(135deg, #F5A623, #e69500); }
    
    #blockly-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #blocklyDiv { flex: 1; height: 100%; overflow: auto; }
    
    /* Blockly toolbox category highlight fix - comprehensive reset */
    .blocklyToolboxCategory {
      display: block !important;
    }
    .blocklyToolboxCategory .blocklyTreeRow {
      display: flex !important;
      align-items: center !important;
      padding: 8px 12px !important;
      border-radius: 8px;
      margin: 2px 4px !important;
      height: auto !important;
      line-height: normal !important;
      transition: background-color 0.2s;
    }
    .blocklyToolboxCategory .blocklyTreeRow:hover {
      background-color: rgba(255,255,255,0.1) !important;
    }
    .blocklyToolboxCategory .blocklyTreeRow.blocklyTreeSelected {
      background-color: var(--catColour, #4A90D9) !important;
    }
    .blocklyToolboxCategory .blocklyTreeIcon {
      display: none !important;
    }
    .blocklyToolboxCategory .blocklyTreeLabel {
      color: white !important;
      font-size: 14px;
      font-weight: 600;
      flex: 1;
    }
    .blocklyToolboxCategory .blocklyTreeRowContentContainer {
      display: flex !important;
      align-items: center !important;
      gap: 8px;
    }
    
    #status-bar {
      height: 44px;
      padding: 0 16px;
      background: rgba(0,0,0,0.4);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    #status-left { display: flex; gap: 16px; }
    #block-count { color: #888; font-size: 13px; }
    #level-indicator { color: #666; font-size: 12px; }
    #status-right { display: flex; align-items: center; }
    #status-badge { padding: 5px 14px; border-radius: 15px; font-size: 12px; font-weight: 700; }
    #status-badge.ready { background: rgba(74, 144, 217, 0.2); color: #4A90D9; }
    #status-badge.running { background: rgba(245, 166, 35, 0.2); color: #F5A623; }
    #status-badge.success { background: rgba(80, 200, 120, 0.2); color: #50C878; }
    #status-badge.fail { background: rgba(245, 108, 108, 0.2); color: #F56C6C; }
    
    #position-hud {
      position: absolute;
      bottom: 70px;
      right: 12px;
      background: rgba(10, 18, 32, 0.9);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 11px;
      color: #888;
      border: 1px solid rgba(255,255,255,0.05);
    }
    #position-hud span { color: #4A90D9; font-weight: 700; }
    
    /* Scratch-style block styling */
    .blocklyFlyoutBackground {
      fill: #1a2535 !important;
      fill-opacity: 0.98 !important;
    }
    .blocklyToolbox {
      background: #0d1525 !important;
    }
    .blocklyTreeRow {
      cursor: pointer;
    }
    
    /* Block snap animation */
    
    /* Block snap animation */
    @keyframes blockSnap {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    .blocklyBlockSummary {
      animation: blockSnap 0.2s ease-out;
    }
  </style>
</head>
<body>
  <!-- Onboarding Tutorial -->
  <div id="tutorial-overlay"></div>
  <div id="tutorial-spotlight"></div>
  <div id="tutorial-tooltip">
    <div id="tutorial-text"></div>
  </div>
  <div id="tutorial-arrow">👇</div>
  <button id="tutorial-skip" onclick="skipTutorial()">跳過教學</button>
  <div id="tutorial-progress"></div>
  
  <div id="top-bar">
    <div id="logo-area">
      <span id="logo">🚁</span>
      <span id="level-title">第一關：起飛着陸</span>
    </div>
    <div id="level-selector">
      <button class="level-btn active" data-level="1">1</button>
      <button class="level-btn" data-level="2">2</button>
      <button class="level-btn" data-level="3">3</button>
      <button class="level-btn" data-level="4">4</button>
      <button class="level-btn" data-level="5">5</button>
    </div>
    <div id="top-btns">
      <button class="top-btn solution" onclick="showSolution()">💡 解答</button>
      <button class="top-btn" onclick="showHint()">❓ 提示</button>
      <button class="top-btn theme-toggle" onclick="toggleTheme()">🌙</button>
      <button class="top-btn" onclick="resetScene()">🔄 重置</button>
      <button class="top-btn" onclick="clearBlocks()">🗑️ 清除</button>
    </div>
  </div>
  
  <div id="main-content">
    <div id="stage-panel">
      <div id="stage-header">
        <h3>🎮 遊戲舞台 <span id="cam-label">100%</span></h3>
        <div id="camera-controls">
          <button class="cam-btn" onclick="cameraZoom(1.2)">＋</button>
          <button class="cam-btn" onclick="cameraZoom(0.8)">－</button>
          <button class="cam-btn" onclick="resetCamera()">⟲</button>
          <button class="cam-btn" onclick="toggleFullscreen()">⛶</button>
        </div>
      </div>
      
      <div id="canvas-wrapper">
        <canvas id="renderCanvas"></canvas>
        
        <div id="overlay-ui">
          <div class="info-card">
            <div class="lbl">無人機</div>
            <div class="val" id="drone-state">😴 待機</div>
          </div>
          <div class="info-card">
            <div class="lbl">積木數量</div>
            <div class="val" id="block-num">0</div>
          </div>
          <div class="info-card">
            <div class="lbl">評分</div>
            <div class="val" id="score-val">☆☆☆</div>
          </div>
        </div>
        
        <div id="goal-hud">🏁 終點</div>
        <div id="position-hud">X: <span id="pos-x">0</span> Z: <span id="pos-z">0</span></div>
        
        <!-- Tello Telemetry HUD -->
        <div id="tello-hud">
          <h4>📡 Tello 狀態</h4>
          <div class="tello-row battery">
            <span class="icon">🔋</span>
            <span class="label">電量</span>
            <span class="value" id="hud-battery">100%</span>
          </div>
          <div class="tello-row">
            <span class="icon">📏</span>
            <span class="label">高度</span>
            <span class="value" id="hud-height">0 cm</span>
          </div>
          <div class="tello-row">
            <span class="icon">🌡️</span>
            <span class="label">溫度</span>
            <span class="value" id="hud-temp">28°C</span>
          </div>
          <hr class="tello-divider"/>
          <div class="tello-row">
            <span class="icon">⏱️</span>
            <span class="label">飛行時間</span>
            <span class="value" id="hud-time">00:00</span>
          </div>
          <div class="tello-row">
            <span class="icon">📡</span>
            <span class="label">訊號</span>
            <div class="signal-bars">
              <div class="signal-bar active"></div>
              <div class="signal-bar active"></div>
              <div class="signal-bar active"></div>
              <div class="signal-bar active"></div>
              <div class="signal-bar active"></div>
            </div>
          </div>
        </div>
        
        <div id="win-modal">
          <div id="win-stars">⭐⭐⭐</div>
          <h2 id="win-title">過關了！</h2>
          <p id="win-msg">太棒了！準備好挑戰下一關？</p>
          <div id="win-buttons">
            <button class="win-btn secondary" onclick="replayLevel()">再玩一次</button>
            <button class="win-btn primary" onclick="nextLevel()">下一關 →</button>
          </div>
        </div>
        
        <div id="hint-card"></div>
      </div>
    </div>
    
    <div id="blockly-panel">
      <div id="blockly-header">
        <h3>🧩 積木程式</h3>
        <div id="header-btns">
          <span id="block-counter">0 個積木</span>
          <button id="run-btn" onclick="runProgram()">▶ 執行</button>
        </div>
      </div>
      
      <div id="blockly-area">
        <div id="blocklyDiv"></div>
      </div>
      
      <div id="status-bar">
        <div id="status-left">
          <span id="block-count">0 個積木</span>
          <span id="level-indicator">Level 1 / 5</span>
        </div>
        <div id="status-right">
          <span id="status-badge" class="ready">準備就緒</span>
        </div>
      </div>
    </div>
  </div>

  <xml id="toolbox" style="display: none">
    <category name="🚀 移動" colour="#4A90D9" expanded="true">
      <block type="drone_takeoff"></block>
      <block type="drone_forward"><value name="STEPS"><shadow type="math_number"><field name="NUM">1</field></shadow></value></block>
      <block type="drone_backward"><value name="STEPS"><shadow type="math_number"><field name="NUM">1</field></shadow></value></block>
      <block type="drone_left_turn"></block>
      <block type="drone_right_turn"></block>
    </category>
    <category name="🎯 控制" colour="#F5A623">
      <block type="drone_wait"><value name="SECONDS"><shadow type="math_number"><field name="NUM">1</field></shadow></value></block>
      <block type="drone_repeat"><value name="TIMES"><shadow type="math_number"><field name="NUM">3</field></shadow></value></block>
      <block type="drone_if"></block>
    </category>
    <category name="🎬 外觀" colour="#9B59B6">
      <block type="drone_led_green"></block>
      <block type="drone_led_red"></block>
      <block type="drone_led_yellow"></block>
    </category>
    <category name="🏁 結束" colour="#F56C6C">
      <block type="drone_land"></block>
      <block type="drone_stop"></block>
    </category>
  </xml>

  <script>
    // ===== Global Variables =====
    let canvas, engine, scene, camera;
    let droneNode, droneMeshes = [], propellers = [];
    let groundMesh, goalMesh;
    let shadowGenerator = null;
    let obstacles = [];
    let trailParticles = [];
    let tvScreen, clockHourHand, clockMinuteHand;
    
    let dronePos = { x: 0, z: 0 };
    let droneY = 0.5;
    let droneDirection = 0;
    let isFlying = false;
    let isExecuting = false;
    let currentLevel = 0;
    let blockCount = 0;
    let completedLevels = new Set();
    let propSpeed = 0;
    let targetPropSpeed = 0;
    let isDarkTheme = true;
    let zoomLevel = 100;
    
    // ===== Tello Telemetry State =====
    let telloBattery = 100;
    let telloFlightTime = 0;
    let flightStartTime = null;
    let hudIntervalId = null;
    
    // ===== Onboarding Tutorial State =====
    const TUTORIAL_KEY = 'drone_tutorial_done';
    let tutorialStep = 0;
    let tutorialDone = false;
    
    const TUTORIAL_STEPS = [
      {
        target: '#blocklyDiv .blocklyToolboxCategory:first-child',
        text: 'Step 1\n按呢度揀「移動」分類',
        position: 'right',
        waitFor: 'categoryClick'
      },
      {
        target: '#blocklyDiv [data-id="drone_takeoff"]',
        text: 'Step 2\n拖「起飛」積木去右邊',
        position: 'left',
        waitFor: 'blockAddTakeoff'
      },
      {
        target: '#blocklyDiv [data-id="drone_land"]',
        text: 'Step 3\n再拖「降落」積木',
        position: 'left',
        waitFor: 'blockAddLand'
      },
      {
        target: '#run-btn',
        text: 'Step 4\n按「執行」睇結果！',
        position: 'top',
        waitFor: 'runClick'
      }
    ];
    
    function startTutorial() {
      if (tutorialDone || localStorage.getItem(TUTORIAL_KEY)) return;
      tutorialStep = 0;
      showTutorialStep();
    }
    
    function showTutorialStep() {
      if (tutorialStep >= TUTORIAL_STEPS.length) {
        endTutorial();
        return;
      }
      const step = TUTORIAL_STEPS[tutorialStep];
      const target = document.querySelector(step.target);
      if (!target) { tutorialStep++; showTutorialStep(); return; }
      
      const rect = target.getBoundingClientRect();
      const overlay = document.getElementById('tutorial-overlay');
      const spotlight = document.getElementById('tutorial-spotlight');
      const tooltip = document.getElementById('tutorial-tooltip');
      const arrow = document.getElementById('tutorial-arrow');
      const progress = document.getElementById('tutorial-progress');
      
      overlay.classList.add('active');
      spotlight.style.cssText = `left:${rect.left-8}px;top:${rect.top-8}px;width:${rect.width+16}px;height:${rect.height+16}px;`;
      spotlight.onclick = () => {
        const step = TUTORIAL_STEPS[tutorialStep];
        if (step.waitFor === 'categoryClick') {
          const cat = document.querySelector(step.target);
          if (cat) cat.click();
          advanceTutorial(step.waitFor);
        }
      };
      
      document.getElementById('tutorial-text').innerHTML = step.text.replace(/\n/g, '<br>');
      
      tooltip.className = 'tutorial-tooltip ' + step.position;
      const tooltipW = 220, tooltipH = 80;
      if (step.position === 'right') {
        tooltip.style.cssText = `left:${rect.right+20}px;top:${rect.top+rect.height/2-tooltipH/2}px`;
        arrow.style.cssText = `left:${rect.left-30}px;top:${rect.top+rect.height/2-14}px`;
      } else if (step.position === 'left') {
        tooltip.style.cssText = `left:${rect.left-tooltipW-20}px;top:${rect.top+rect.height/2-tooltipH/2}px`;
        arrow.style.cssText = `left:${rect.right+10}px;top:${rect.top+rect.height/2-14}px`;
      } else if (step.position === 'top') {
        tooltip.style.cssText = `left:${rect.left+rect.width/2-tooltipW/2}px;top:${rect.bottom+20}px`;
        arrow.style.cssText = `left:${rect.left+rect.width/2-14}px;top:${rect.top-40}px`;
      } else {
        tooltip.style.cssText = `left:${rect.left+rect.width/2-tooltipW/2}px;top:${rect.top-tooltipH-20}px`;
        arrow.style.cssText = `left:${rect.left+rect.width/2-14}px;top:${rect.bottom+10}px`;
      }
      
      // Progress dots
      progress.innerHTML = TUTORIAL_STEPS.map((_, i) => 
        `<div class="tutorial-dot ${i<tutorialStep?'done':i===tutorialStep?'active':''}"></div>`
      ).join('');
    }
    
    function advanceTutorial(waitFor) {
      const step = TUTORIAL_STEPS[tutorialStep];
      if (!step || step.waitFor !== waitFor) return;
      tutorialStep++;
      showTutorialStep();
    }
    
    function endTutorial() {
      document.getElementById('tutorial-overlay').classList.remove('active');
      document.getElementById('tutorial-spotlight').style.cssText = '';
      document.getElementById('tutorial-tooltip').style.cssText = '';
      document.getElementById('tutorial-arrow').style.cssText = '';
      tutorialDone = true;
      localStorage.setItem(TUTORIAL_KEY, 'true');
    }
    
    function skipTutorial() { endTutorial(); }
    
    // ===== Level Data =====
    const LEVELS = [
      { name: '第一關：起飛着陸', hint: '🎯 目標：讓無人機起飛，前進 3 格，然後着陸！\n\n💡 提示：起飛 → 前進 × 3 → 着陸', solution: ['drone_takeoff','drone_forward','drone_forward','drone_forward','drone_land'], start: { x: -6, z: 0 }, goal: { x: 3, z: 0 }, cameraPos: { alpha: -Math.PI / 2, beta: Math.PI / 3, radius: 18 }, obstacles: [] },
      { name: '第二關：轉向前進', hint: '🎯 目標：L 形路線，先前進再左轉，然後着陸\n\n💡 提示：起飛 → 前進 → 左轉 → 前進 → 着陸', solution: ['drone_takeoff','drone_forward','drone_left_turn','drone_forward','drone_forward','drone_land'], start: { x: -6, z: 4 }, goal: { x: -2, z: -4 }, cameraPos: { alpha: -Math.PI / 2.5, beta: Math.PI / 3.5, radius: 20 }, obstacles: [] },
      { name: '第三關：正方形', hint: '🎯 目標：走正方形路線\n\n💡 提示：前進 → 右轉 × 3（正方形）→ 着陸', solution: ['drone_takeoff','drone_forward','drone_right_turn','drone_forward','drone_right_turn','drone_forward','drone_right_turn','drone_forward','drone_land'], start: { x: 0, z: 5 }, goal: { x: 0, z: 5 }, cameraPos: { alpha: -Math.PI / 2, beta: Math.PI / 4, radius: 22 }, obstacles: [] },
      { name: '第四關：長距離', hint: '🎯 目標：穿越整個客廳到終點\n\n💡 提示：使用「重複」積木減少積木數量', solution: ['drone_takeoff','drone_repeat','drone_forward','drone_land'], start: { x: -8, z: 0 }, goal: { x: 8, z: 0 }, cameraPos: { alpha: -Math.PI / 2, beta: Math.PI / 3, radius: 25 }, obstacles: [{ x: 0, z: 0, w: 1.5, h: 8, color: '#8B4513' }] },
      { name: '第五關：迷宮挑戰', hint: '🎯 目標：繞過障礙物到達終點\n\n💡 提示：需要多次轉向來繞過障礙', solution: ['drone_takeoff','drone_forward','drone_forward','drone_left_turn','drone_forward','drone_forward','drone_right_turn','drone_forward','drone_forward','drone_land'], start: { x: -7, z: 5 }, goal: { x: 7, z: -5 }, cameraPos: { alpha: -Math.PI / 1.8, beta: Math.PI / 3.5, radius: 24 }, obstacles: [{ x: -3, z: 2, w: 6, h: 1, color: '#654321' }, { x: 3, z: -2, w: 6, h: 1, color: '#654321' }] }
    ];
    
    // ===== Blockly Blocks =====
    function defineBlocks() {
      Blockly.Blocks['drone_takeoff'] = { init: function() { this.appendDummyInput().appendField('🚀 起飛'); this.setPreviousStatement(true, null); this.setNextStatement(true, null); this.setColour('#4A90D9'); } };
      Blockly.Blocks['drone_forward'] = { init: function() { this.appendValueInput('STEPS').appendField('⬆️ 前進').setCheck('Number'); this.setInputsInline(true); this.setPreviousStatement(true, null); this.setNextStatement(true, null); this.setColour('#4A90D9'); } };
      Blockly.Blocks['drone_backward'] = { init: function() { this.appendValueInput('STEPS').appendField('⬇️ 後退').setCheck('Number'); this.setInputsInline(true); this.setPreviousStatement(true, null); this.setNextStatement(true, null); this.setColour('#4A90D9'); } };
      Blockly.Blocks['drone_left_turn'] = { init: function() { this.appendDummyInput().appendField('↩️ 左轉 90°'); this.setPreviousStatement(true, null); this.setNextStatement(true, null); this.setColour('#4A90D9'); } };
      Blockly.Blocks['drone_right_turn'] = { init: function() { this.appendDummyInput().appendField('↪️ 右轉 90°'); this.setPreviousStatement(true, null); this.setNextStatement(true, null); this.setColour('#4A90D9'); } };
      Blockly.Blocks['drone_wait'] = { init: function() { this.appendValueInput('SECONDS').appendField('⏱️ 等待').setCheck('Number'); this.setInputsInline(true); this.setPreviousStatement(true, null); this.setNextStatement(true, null); this.setColour('#F5A623'); } };
      Blockly.Blocks['drone_repeat'] = { init: function() { this.appendValueInput('TIMES').appendField('🔄 重複').setCheck('Number'); this.appendStatementInput('DO'); this.setInputsInline(true); this.setPreviousStatement(true, null); this.setNextStatement(true, null); this.setColour('#F5A623'); } };
      Blockly.Blocks['drone_if'] = { init: function() { this.appendDummyInput().appendField('⚠️ 如果前方有障礙'); this.appendStatementInput('DO'); this.setPreviousStatement(true, null); this.setNextStatement(true, null); this.setColour('#F5A623'); } };
      Blockly.Blocks['drone_led_green'] = { init: function() { this.appendDummyInput().appendField('💚 LED 綠'); this.setPreviousStatement(true, null); this.setNextStatement(true, null); this.setColour('#9B59B6'); } };
      Blockly.Blocks['drone_led_red'] = { init: function() { this.appendDummyInput().appendField('❤️ LED 紅'); this.setPreviousStatement(true, null); this.setNextStatement(true, null); this.setColour('#9B59B6'); } };
      Blockly.Blocks['drone_led_yellow'] = { init: function() { this.appendDummyInput().appendField('💛 LED 黃'); this.setPreviousStatement(true, null); this.setNextStatement(true, null); this.setColour('#9B59B6'); } };
      Blockly.Blocks['drone_land'] = { init: function() { this.appendDummyInput().appendField('🛬 着陸'); this.setPreviousStatement(true, null); this.setNextStatement(true, null); this.setColour('#F56C6C'); } };
      Blockly.Blocks['drone_stop'] = { init: function() { this.appendDummyInput().appendField('⏹️ 停止'); this.setPreviousStatement(true, null); this.setNextStatement(true, null); this.setColour('#F56C6C'); } };
    }
    
    // ===== Babylon.js Init =====
    function initBabylon() {
      canvas = document.getElementById('renderCanvas');
      engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true, antialias: true });
      
      scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0.04, 0.08, 0.13, 1);
      
      camera = new BABYLON.ArcRotateCamera('cam', -Math.PI / 2, Math.PI / 3, 18, BABYLON.Vector3.Zero(), scene);
      camera.attachControl(canvas, true);
      camera.lowerRadiusLimit = 8;
      camera.upperRadiusLimit = 50;
      camera.lowerBetaLimit = 0.2;
      camera.upperBetaLimit = Math.PI / 2.1;
      camera.wheelPrecision = 30;
      camera.pinchPrecision = 50;
      
      const hemi = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0, 1, 0), scene);
      hemi.intensity = 0.5;
      hemi.groundColor = new BABYLON.Color3(0.15, 0.15, 0.2);
      
      const dirLight = new BABYLON.DirectionalLight('dir', new BABYLON.Vector3(-1, -2, -1), scene);
      dirLight.intensity = 0.9;
      dirLight.position = new BABYLON.Vector3(10, 20, 10);
      
      shadowGenerator = new BABYLON.ShadowGenerator(1024, dirLight);
      shadowGenerator.useBlurExponentialShadowMap = true;
      shadowGenerator.blurKernel = 32;
      
      createRoom();
      createDrone();
      createGoal();
      createEnvironment();
      
      engine.runRenderLoop(() => {
        // Animate environment
        animateEnvironment();
        
        // Animate propeller speed
        propSpeed += (targetPropSpeed - propSpeed) * 0.05;
        propellers.forEach((prop, i) => {
          prop.rotation.y += propSpeed * (i % 2 === 0 ? 1 : -1);
        });
        
        scene.render();
      });
      
      window.addEventListener('resize', () => engine.resize());
    }
    
    function createRoom() {
      groundMesh = BABYLON.MeshBuilder.CreateGround('floor', { width: 28, height: 20 }, scene);
      const floorMat = new BABYLON.StandardMaterial('floorMat', scene);
      const floorTex = new BABYLON.DynamicTexture('floorTex', { width: 1024, height: 1024 }, scene);
      const ctx = floorTex.getContext();
      ctx.fillStyle = '#8B7355';
      ctx.fillRect(0, 0, 1024, 1024);
      for (let i = 0; i < 14; i++) {
        ctx.strokeStyle = '#7a6348';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(i * 73, 0);
        ctx.lineTo(i * 73, 1024);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(90, 70, 50, 0.15)';
        ctx.lineWidth = 1;
        for (let j = 0; j < 8; j++) {
          ctx.beginPath();
          ctx.moveTo(i * 73, j * 128);
          ctx.lineTo((i + 1) * 73, j * 128 + 20);
          ctx.stroke();
        }
      }
      floorTex.update();
      floorMat.diffuseTexture = floorTex;
      floorMat.specularColor = new BABYLON.Color3(0.15, 0.15, 0.15);
      groundMesh.material = floorMat;
      groundMesh.receiveShadows = true;
      
      const wallMat = new BABYLON.StandardMaterial('wallMat', scene);
      wallMat.diffuseColor = new BABYLON.Color3(0.55, 0.75, 0.85);
      wallMat.alpha = 0.25;
      wallMat.backFaceCulling = false;
      
      const backWall = BABYLON.MeshBuilder.CreatePlane('backWall', { width: 28, height: 10 }, scene);
      backWall.position = new BABYLON.Vector3(0, 5, -10);
      backWall.material = wallMat;
      
      const leftWall = BABYLON.MeshBuilder.CreatePlane('leftWall', { width: 20, height: 10 }, scene);
      leftWall.position = new BABYLON.Vector3(-14, 5, 0);
      leftWall.rotation.y = Math.PI / 2;
      leftWall.material = wallMat;
      
      const rightWall = BABYLON.MeshBuilder.CreatePlane('rightWall', { width: 20, height: 10 }, scene);
      rightWall.position = new BABYLON.Vector3(14, 5, 0);
      rightWall.rotation.y = -Math.PI / 2;
      rightWall.material = wallMat;
      
      // Furniture
      const sofa = BABYLON.MeshBuilder.CreateBox('sofa', { width: 5, height: 1.2, depth: 1.8 }, scene);
      sofa.position = new BABYLON.Vector3(-9, 0.6, -6);
      const sofaMat = new BABYLON.StandardMaterial('sofaMat', scene);
      sofaMat.diffuseColor = new BABYLON.Color3(0.7, 0.45, 0.25);
      sofa.material = sofaMat;
      sofa.receiveShadows = true;
      if (shadowGenerator) shadowGenerator.addShadowCaster(sofa);
      
      const table = BABYLON.MeshBuilder.CreateBox('table', { width: 2.5, height: 0.7, depth: 1.5 }, scene);
      table.position = new BABYLON.Vector3(5, 0.35, -6);
      const tableMat = new BABYLON.StandardMaterial('tableMat', scene);
      tableMat.diffuseColor = new BABYLON.Color3(0.5, 0.35, 0.2);
      table.material = tableMat;
      table.receiveShadows = true;
      if (shadowGenerator) shadowGenerator.addShadowCaster(table);
      
      const pot = BABYLON.MeshBuilder.CreateCylinder('pot', { height: 0.8, diameterTop: 0.6, diameterBottom: 0.5 }, scene);
      pot.position = new BABYLON.Vector3(-5, 0.4, -6);
      const potMat = new BABYLON.StandardMaterial('potMat', scene);
      potMat.diffuseColor = new BABYLON.Color3(0.6, 0.35, 0.2);
      pot.material = potMat;
      
      const plant = BABYLON.MeshBuilder.CreateSphere('plant', { diameter: 1.2 }, scene);
      plant.position = new BABYLON.Vector3(-5, 1.2, -6);
      const plantMat = new BABYLON.StandardMaterial('plantMat', scene);
      plantMat.diffuseColor = new BABYLON.Color3(0.15, 0.5, 0.15);
      plant.material = plantMat;
      if (shadowGenerator) shadowGenerator.addShadowCaster(plant);
    }
    
    function createEnvironment() {
      // TV with animated screen
      const tv = BABYLON.MeshBuilder.CreateBox('tv', { width: 4.5, height: 2.5, depth: 0.3 }, scene);
      tv.position = new BABYLON.Vector3(0, 1.8, -9.7);
      const tvMat = new BABYLON.StandardMaterial('tvMat', scene);
      tvMat.diffuseColor = new BABYLON.Color3(0.15, 0.15, 0.17);
      tv.material = tvMat;
      if (shadowGenerator) shadowGenerator.addShadowCaster(tv);
      
      tvScreen = BABYLON.MeshBuilder.CreatePlane('tvScreen', { width: 3.8, height: 2 }, scene);
      tvScreen.position = new BABYLON.Vector3(0, 1.8, -9.55);
      const screenMat = new BABYLON.StandardMaterial('screenMat', scene);
      screenMat.diffuseColor = new BABYLON.Color3(0.2, 0.4, 0.8);
      screenMat.emissiveColor = new BABYLON.Color3(0.1, 0.2, 0.4);
      tvScreen.material = screenMat;
      
      // Clock
      const clock = BABYLON.MeshBuilder.CreateCylinder('clock', { height: 0.15, diameter: 1 }, scene);
      clock.position = new BABYLON.Vector3(-6, 5, -9.7);
      clock.rotation.x = Math.PI / 2;
      const clockMat = new BABYLON.StandardMaterial('clockMat', scene);
      clockMat.diffuseColor = new BABYLON.Color3(0.9, 0.9, 0.9);
      clock.material = clockMat;
      
      clockHourHand = BABYLON.MeshBuilder.CreateBox('hourHand', { width: 0.05, height: 0.35, depth: 0.05 }, scene);
      clockHourHand.position = new BABYLON.Vector3(-6, 5, -9.6);
      const handMat = new BABYLON.StandardMaterial('handMat', scene);
      handMat.diffuseColor = new BABYLON.Color3(0.2, 0.2, 0.2);
      clockHourHand.material = handMat;
      
      clockMinuteHand = BABYLON.MeshBuilder.CreateBox('minuteHand', { width: 0.03, height: 0.45, depth: 0.03 }, scene);
      clockMinuteHand.position = new BABYLON.Vector3(-6, 5, -9.6);
      clockMinuteHand.material = handMat;
      
      // Window with curtains
      const windowFrame = BABYLON.MeshBuilder.CreateBox('windowFrame', { width: 3.5, height: 2.5, depth: 0.15 }, scene);
      windowFrame.position = new BABYLON.Vector3(4, 5, -9.7);
      const windowMat = new BABYLON.StandardMaterial('windowMat', scene);
      windowMat.diffuseColor = new BABYLON.Color3(0.9, 0.85, 0.7);
      windowFrame.material = windowMat;
      
      const windowGlass = BABYLON.MeshBuilder.CreatePlane('windowGlass', { width: 2.8, height: 1.8 }, scene);
      windowGlass.position = new BABYLON.Vector3(4, 5, -9.6);
      const glassMat = new BABYLON.StandardMaterial('glassMat', scene);
      glassMat.diffuseColor = new BABYLON.Color3(0.5, 0.7, 0.9);
      glassMat.alpha = 0.5;
      windowGlass.material = glassMat;
      
      // Curtains
      const curtainMat = new BABYLON.StandardMaterial('curtainMat', scene);
      curtainMat.diffuseColor = new BABYLON.Color3(0.7, 0.5, 0.5);
      
      const leftCurtain = BABYLON.MeshBuilder.CreateBox('leftCurtain', { width: 0.6, height: 3, depth: 0.08 }, scene);
      leftCurtain.position = new BABYLON.Vector3(2.3, 4.5, -9.5);
      leftCurtain.material = curtainMat;
      
      const rightCurtain = BABYLON.MeshBuilder.CreateBox('rightCurtain', { width: 0.6, height: 3, depth: 0.08 }, scene);
      rightCurtain.position = new BABYLON.Vector3(5.7, 4.5, -9.5);
      rightCurtain.material = curtainMat;
    }
    
    function animateEnvironment() {
      // Clock hands rotation
      const now = new Date();
      const hours = now.getHours() % 12;
      const minutes = now.getMinutes();
      const seconds = now.getSeconds();
      
      const hourAngle = (hours * 30 + minutes * 0.5) * Math.PI / 180;
      const minuteAngle = (minutes * 6 + seconds * 0.1) * Math.PI / 180;
      
      clockHourHand.rotation.y = -hourAngle;
      clockMinuteHand.rotation.y = -minuteAngle;
      
      // TV screen animation (color cycling)
      if (tvScreen && tvScreen.material) {
        const t = Date.now() / 1000;
        const r = Math.sin(t * 0.5) * 0.1 + 0.15;
        const g = Math.sin(t * 0.7 + 1) * 0.1 + 0.2;
        const b = Math.sin(t * 0.9 + 2) * 0.1 + 0.4;
        tvScreen.material.emissiveColor = new BABYLON.Color3(r, g, b);
      }
    }
    
    function createDrone() {
      droneNode = new BABYLON.TransformNode('drone', scene);
      droneMeshes = [];
      propellers = [];
      
      // Body
      const body = BABYLON.MeshBuilder.CreateBox('body', { width: 0.9, height: 0.3, depth: 0.9 }, scene);
      body.parent = droneNode;
      const bodyMat = new BABYLON.StandardMaterial('bodyMat', scene);
      bodyMat.diffuseColor = new BABYLON.Color3(0.25, 0.35, 0.45);
      bodyMat.specularColor = new BABYLON.Color3(0.4, 0.4, 0.4);
      body.material = bodyMat;
      droneMeshes.push(body);
      
      const armMat = new BABYLON.StandardMaterial('armMat', scene);
      armMat.diffuseColor = new BABYLON.Color3(0.18, 0.2, 0.25);
      
      const armPositions = [{ x: 0.7, z: 0.7 }, { x: -0.7, z: 0.7 }, { x: 0.7, z: -0.7 }, { x: -0.7, z: -0.7 }];
      
      armPositions.forEach((pos, i) => {
        const arm = BABYLON.MeshBuilder.CreateBox('arm' + i, { width: 0.1, height: 0.08, depth: 0.7 }, scene);
        arm.position = new BABYLON.Vector3(pos.x, 0, pos.z);
        arm.rotation.y = Math.atan2(pos.x, pos.z);
        arm.parent = droneNode;
        arm.material = armMat;
        droneMeshes.push(arm);
        
        const motor = BABYLON.MeshBuilder.CreateCylinder('motor' + i, { height: 0.15, diameter: 0.25 }, scene);
        motor.position = new BABYLON.Vector3(pos.x * 1.1, 0.12, pos.z * 1.1);
        motor.parent = droneNode;
        const motorMat = new BABYLON.StandardMaterial('motorMat', scene);
        motorMat.diffuseColor = new BABYLON.Color3(0.15, 0.15, 0.18);
        motor.material = motorMat;
        droneMeshes.push(motor);
        
        // Propeller
        const prop = BABYLON.MeshBuilder.CreateCylinder('prop' + i, { height: 0.02, diameter: 0.6 }, scene);
        prop.position = new BABYLON.Vector3(pos.x * 1.1, 0.22, pos.z * 1.1);
        prop.parent = droneNode;
        const propMat = new BABYLON.StandardMaterial('propMat', scene);
        propMat.diffuseColor = new BABYLON.Color3(0.6, 0.6, 0.65);
        propMat.specularColor = new BABYLON.Color3(0.8, 0.8, 0.8);
        prop.material = propMat;
        propellers.push(prop);
        droneMeshes.push(prop);
      });
      
      // LED
      const led = BABYLON.MeshBuilder.CreateSphere('led', { diameter: 0.15 }, scene);
      led.position = new BABYLON.Vector3(0, 0.18, -0.5);
      led.parent = droneNode;
      const ledMat = new BABYLON.StandardMaterial('ledMat', scene);
      ledMat.diffuseColor = new BABYLON.Color3(0.2, 0.9, 0.3);
      ledMat.emissiveColor = new BABYLON.Color3(0.2, 0.9, 0.3);
      led.material = ledMat;
      droneMeshes.push(led);
      
      droneMeshes.forEach(mesh => {
        if (shadowGenerator) shadowGenerator.addShadowCaster(mesh);
      });
    }
    
    function createGoal() {
      goalMesh = BABYLON.MeshBuilder.CreateCylinder('goalPad', { height: 0.04, diameter: 2.5 }, scene);
      const goalMat = new BABYLON.StandardMaterial('goalMat', scene);
      goalMat.diffuseColor = new BABYLON.Color3(0.3, 0.7, 0.3);
      goalMat.emissiveColor = new BABYLON.Color3(0.08, 0.2, 0.08);
      goalMat.alpha = 0.7;
      goalMesh.material = goalMat;
      
      const pole = BABYLON.MeshBuilder.CreateCylinder('pole', { height: 2, diameter: 0.06 }, scene);
      pole.position.y = 1;
      pole.parent = goalMesh;
      const poleMat = new BABYLON.StandardMaterial('poleMat', scene);
      poleMat.diffuseColor = new BABYLON.Color3(0.35, 0.22, 0.12);
      pole.material = poleMat;
      
      const flag = BABYLON.MeshBuilder.CreatePlane('flag', { width: 0.8, height: 0.5 }, scene);
      flag.position = new BABYLON.Vector3(0.45, 1.5, 0);
      flag.rotation.y = Math.PI / 2;
      flag.parent = goalMesh;
      const flagMat = new BABYLON.StandardMaterial('flagMat', scene);
      flagMat.diffuseColor = new BABYLON.Color3(0.95, 0.2, 0.2);
      flagMat.emissiveColor = new BABYLON.Color3(0.3, 0.05, 0.05);
      flag.material = flagMat;
      
      updateGoalPosition();
    }
    
    function updateGoalPosition() {
      const level = LEVELS[currentLevel];
      goalMesh.position = new BABYLON.Vector3(level.goal.x, 0.02, level.goal.z);
      
      obstacles.forEach(o => o.dispose());
      obstacles = [];
      
      level.obstacles.forEach(obs => {
        const box = BABYLON.MeshBuilder.CreateBox('obstacle', { width: obs.w, height: 0.8, depth: obs.h }, scene);
        box.position = new BABYLON.Vector3(obs.x, 0.4, obs.z);
        const obsMat = new BABYLON.StandardMaterial('obsMat', scene);
        obsMat.diffuseColor = new BABYLON.Color3(0.4, 0.25, 0.15);
        obsMat.alpha = 0.9;
        box.material = obsMat;
        box.receiveShadows = true;
        if (shadowGenerator) shadowGenerator.addShadowCaster(box);
        obstacles.push(box);
      });
    }
    
    // ===== Collision Detection =====
    function checkCollision(x, z) {
      const level = LEVELS[currentLevel];
      const droneRadius = 0.6;
      if (x < -12 || x > 12 || z < -9 || z > 9) return true;
      for (const obs of level.obstacles) {
        const hw = obs.w / 2 + droneRadius;
        const hd = obs.h / 2 + droneRadius;
        if (Math.abs(x - obs.x) < hw && Math.abs(z - obs.z) < hd) return true;
      }
      return false;
    }
    
    // ===== Trail =====
    function addTrailParticle(x, z) {
      const particle = BABYLON.MeshBuilder.CreateSphere('trail', { diameter: 0.15 }, scene);
      particle.position = new BABYLON.Vector3(x, 0.1, z);
      const mat = new BABYLON.StandardMaterial('trailMat', scene);
      mat.diffuseColor = new BABYLON.Color3(0.2, 0.6, 1);
      mat.emissiveColor = new BABYLON.Color3(0.1, 0.3, 0.5);
      mat.alpha = 0.6;
      particle.material = mat;
      trailParticles.push(particle);
      setTimeout(() => { particle.dispose(); const idx = trailParticles.indexOf(particle); if (idx > -1) trailParticles.splice(idx, 1); }, 2000);
    }
    
    function clearTrail() {
      trailParticles.forEach(p => p.dispose());
      trailParticles = [];
    }

    // ===== Execute Program =====
    async function runProgram() {
      if (isExecuting) return;
      advanceTutorial('runClick');
      const allBlocks = workspace.getAllBlocks();
      if (allBlocks.length === 0) { setStatus('fail', '請先加入積木！'); return; }
      
      isExecuting = true;
      document.getElementById('run-btn').classList.add('running');
      document.getElementById('run-btn').disabled = true;
      setStatus('running', '🔄 執行中...');
      
      clearTrail();
      resetDroneState();
      targetPropSpeed = 0.15; // Start propellers spinning
      
      const blocksToExecute = [];
      const visited = new Set();
      
      function collectBlocks(block) {
        if (!block || visited.has(block.id)) return;
        visited.add(block.id);
        blocksToExecute.push(block);
        const nextBlock = block.getNextBlock();
        if (nextBlock) collectBlocks(nextBlock);
      }
      
      workspace.getTopBlocks().forEach(block => collectBlocks(block));
      
      for (const block of blocksToExecute) {
        await executeBlock(block);
        if (!isExecuting) break;
      }
      
      isExecuting = false;
      targetPropSpeed = 0; // Stop propellers
      document.getElementById('run-btn').classList.remove('running');
      document.getElementById('run-btn').disabled = false;
      
      checkGoal();
    }
    
    function resetDroneState() {
      const level = LEVELS[currentLevel];
      droneNode.position = new BABYLON.Vector3(level.start.x, 0.5, level.start.z);
      droneNode.rotation = BABYLON.Vector3.Zero();
      dronePos = { x: level.start.x, z: level.start.z };
      droneY = 0.5;
      droneDirection = 0;
      isFlying = false;
      targetPropSpeed = 0;
      updateDroneUI('😴', '待機');
      resetTelemetry();
    }
    
    async function executeBlock(block) {
      if (!block.isEnabled()) return;
      
      const type = block.type;
      let steps = 1;
      let seconds = 1;
      
      switch (type) {
        case 'drone_forward':
        case 'drone_backward':
          const stepsBlock = block.getInput('STEPS')?.connection?.targetBlock();
          if (stepsBlock?.getFieldValue) steps = Math.max(1, Math.min(10, parseInt(stepsBlock.getFieldValue('NUM')) || 1));
          break;
        case 'drone_wait':
          const secBlock = block.getInput('SECONDS')?.connection?.targetBlock();
          if (secBlock?.getFieldValue) seconds = Math.max(0.5, Math.min(5, parseFloat(secBlock.getFieldValue('NUM')) || 1));
          break;
        case 'drone_repeat':
          const timesBlock = block.getInput('TIMES')?.connection?.targetBlock();
          if (timesBlock?.getFieldValue) steps = Math.max(1, Math.min(10, parseInt(timesBlock.getFieldValue('NUM')) || 1));
          break;
      }
      
      switch (type) {
        case 'drone_takeoff': await animateTakeoff(); break;
        case 'drone_forward':
          for (let i = 0; i < steps; i++) { await animateMove(1); }
          break;
        case 'drone_backward':
          for (let i = 0; i < steps; i++) { await animateMove(-1); }
          break;
        case 'drone_left_turn': await animateTurn(-90); break;
        case 'drone_right_turn': await animateTurn(90); break;
        case 'drone_wait': await delay(seconds * 500); break;
        case 'drone_land': await animateLand(); break;
        case 'drone_repeat':
          const childBlock = block.getInput('DO')?.connection?.targetBlock();
          if (childBlock) { for (let i = 0; i < steps; i++) { await executeBlock(childBlock); if (!isExecuting) break; } }
          break;
        case 'drone_if':
          const rad = droneDirection * Math.PI / 180;
          const nextX = dronePos.x + Math.cos(rad) * 2;
          const nextZ = dronePos.z + Math.sin(rad) * 2;
          if (checkCollision(nextX, nextZ)) {
            const childBlock = block.getInput('DO')?.connection?.targetBlock();
            if (childBlock) await executeBlock(childBlock);
          }
          break;
        case 'drone_led_green': setLEDColor(0.2, 0.9, 0.3); break;
        case 'drone_led_red': setLEDColor(0.9, 0.2, 0.2); break;
        case 'drone_led_yellow': setLEDColor(0.9, 0.9, 0.2); break;
        case 'drone_stop': isExecuting = false; break;
      }
      
      updatePositionHUD();
    }
    
    async function animateTakeoff() {
      if (!isFlying) {
        isFlying = true;
        flightStartTime = Date.now(); // Start flight timer
        targetPropSpeed = 0.25; // Faster spin for takeoff
        updateDroneUI('😀', '起飛中');
        createParticleEffect(droneNode.position.x, droneNode.position.z, 'takeoff');
        
        const startY = droneY;
        const targetY = 2.5;
        const duration = 700;
        const startTime = Date.now();
        
        return new Promise(resolve => {
          function animate() {
            const t = Math.min((Date.now() - startTime) / duration, 1);
            const eased = 1 - Math.pow(1 - t, 3);
            droneY = startY + (targetY - startY) * eased;
            droneNode.position.y = droneY;
            droneNode.rotation.x = Math.sin(t * 20) * 0.02;
            droneNode.rotation.z = Math.cos(t * 15) * 0.02;
            if (t < 1) requestAnimationFrame(animate);
            else { droneNode.rotation = BABYLON.Vector3.Zero(); targetPropSpeed = 0.15; resolve(); }
          }
          animate();
        });
      }
    }
    
    async function animateMove(dir) {
      if (!isFlying) await animateTakeoff();
      
      updateDroneUI('😎', '移動中');
      
      const rad = droneDirection * Math.PI / 180;
      const dx = Math.cos(rad) * dir * 1.5;
      const dz = Math.sin(rad) * dir * 1.5;
      
      const targetX = dronePos.x + dx;
      const targetZ = dronePos.z + dz;
      
      if (checkCollision(targetX, targetZ)) {
        updateDroneUI('😱', '撞到了！');
        setStatus('fail', '💥 撞到障礙物！');
        playFailSound();
        isExecuting = false;
        targetPropSpeed = 0;
        return;
      }
      
      const startX = dronePos.x;
      const startZ = dronePos.z;
      const duration = 400;
      const startTime = Date.now();
      
      return new Promise(resolve => {
        function animate() {
          const t = Math.min((Date.now() - startTime) / duration, 1);
          const eased = 1 - Math.pow(1 - t, 2);
          dronePos.x = startX + (targetX - startX) * eased;
          dronePos.z = startZ + (targetZ - startZ) * eased;
          droneNode.position.x = dronePos.x;
          droneNode.position.z = dronePos.z;
          addTrailParticle(dronePos.x, dronePos.z);
          if (t < 1) requestAnimationFrame(animate);
          else { dronePos.x = targetX; dronePos.z = targetZ; resolve(); }
        }
        animate();
      });
    }
    
    async function animateTurn(angle) {
      if (!isFlying) await animateTakeoff();
      
      updateDroneUI('😉', '轉向中');
      
      const targetRot = (droneDirection + angle + 360) % 360;
      const startYRot = droneNode.rotation.y;
      const targetYRot = targetRot * Math.PI / 180;
      const duration = 350;
      const startTime = Date.now();
      
      return new Promise(resolve => {
        function animate() {
          const t = Math.min((Date.now() - startTime) / duration, 1);
          const eased = 1 - Math.pow(1 - t, 2);
          droneNode.rotation.y = startYRot + (targetYRot - startYRot) * eased;
          if (t < 1) requestAnimationFrame(animate);
          else { droneDirection = targetRot; droneNode.rotation.y = targetYRot; resolve(); }
        }
        animate();
      });
    }
    
    async function animateLand() {
      isFlying = false;
      targetPropSpeed = 0.1; // Slow down for landing
      updateDroneUI('🥰', '降落中');
      createParticleEffect(droneNode.position.x, droneNode.position.z, 'land');
      
      const startY = droneY;
      const targetY = 0.5;
      const duration = 700;
      const startTime = Date.now();
      
      return new Promise(resolve => {
        function animate() {
          const t = Math.min((Date.now() - startTime) / duration, 1);
          const eased = t * t;
          droneY = startY + (targetY - startY) * eased;
          droneNode.position.y = droneY;
          if (t < 1) requestAnimationFrame(animate);
          else { droneY = targetY; droneNode.position.y = targetY; targetPropSpeed = 0; resolve(); }
        }
        animate();
      });
    }
    
    function createParticleEffect(x, z, type) {
      const particleSystem = new BABYLON.ParticleSystem('particles', 30, scene);
      particleSystem.particleTexture = new BABYLON.Texture('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAYAAADED76LAAAAGklEQVQYV2NkYGD4z4AHMDLQAowMowAy0w8DAJbNAwU7lNqCAAAAAElFTkSuQmCC', scene);
      
      particleSystem.emitter = new BABYLON.Vector3(x, type === 'takeoff' ? 0.5 : 0.2, z);
      particleSystem.minEmitBox = new BABYLON.Vector3(-0.5, 0, -0.5);
      particleSystem.maxEmitBox = new BABYLON.Vector3(0.5, 0, 0.5);
      
      if (type === 'takeoff') {
        particleSystem.color1 = new BABYLON.Color4(0.2, 0.8, 1, 1);
        particleSystem.color2 = new BABYLON.Color4(0.5, 0.9, 1, 1);
        particleSystem.colorDead = new BABYLON.Color4(0.2, 0.6, 1, 0);
        particleSystem.minSize = 0.1;
        particleSystem.maxSize = 0.3;
        particleSystem.minLifeTime = 0.5;
        particleSystem.maxLifeTime = 1;
        particleSystem.emitRate = 30;
        particleSystem.gravity = new BABYLON.Vector3(0, 2, 0);
        particleSystem.direction1 = new BABYLON.Vector3(-0.5, 1, -0.5);
        particleSystem.direction2 = new BABYLON.Vector3(0.5, 1, 0.5);
      } else {
        particleSystem.color1 = new BABYLON.Color4(0.8, 0.6, 0.2, 1);
        particleSystem.color2 = new BABYLON.Color4(1, 0.8, 0.3, 1);
        particleSystem.colorDead = new BABYLON.Color4(0.8, 0.6, 0.2, 0);
        particleSystem.minSize = 0.15;
        particleSystem.maxSize = 0.4;
        particleSystem.minLifeTime = 0.3;
        particleSystem.maxLifeTime = 0.8;
        particleSystem.emitRate = 50;
        particleSystem.gravity = new BABYLON.Vector3(0, -3, 0);
        particleSystem.direction1 = new BABYLON.Vector3(-1, -0.5, -1);
        particleSystem.direction2 = new BABYLON.Vector3(1, -0.5, 1);
      }
      
      particleSystem.minEmitPower = 0.5;
      particleSystem.maxEmitPower = 1;
      particleSystem.updateSpeed = 0.01;
      
      particleSystem.start();
      setTimeout(() => { particleSystem.stop(); setTimeout(() => particleSystem.dispose(), 1000); }, 500);
    }
    
    function setLEDColor(r, g, b) {
      droneMeshes.forEach(mesh => {
        if (mesh.name === 'led' && mesh.material) {
          mesh.material.emissiveColor = new BABYLON.Color3(r, g, b);
          mesh.material.diffuseColor = new BABYLON.Color3(r, g, b);
        }
      });
    }
    
    function delay(ms) { return new Promise(r => setTimeout(r, ms)); }
    
    // ===== UI Functions =====
    function updateDroneUI(expr, text) { document.getElementById('drone-state').textContent = `${expr} ${text}`; }
    function updatePositionHUD() { document.getElementById('pos-x').textContent = dronePos.x.toFixed(1); document.getElementById('pos-z').textContent = dronePos.z.toFixed(1); }
    function setStatus(type, msg) { const badge = document.getElementById('status-badge'); badge.className = type; badge.textContent = msg; }
    
    function checkGoal() {
      const level = LEVELS[currentLevel];
      const dx = Math.abs(dronePos.x - level.goal.x);
      const dz = Math.abs(dronePos.z - level.goal.z);
      if (dx < 1.8 && dz < 1.8) showWin();
      else if (!isFlying) { setStatus('fail', '❌ 着陸了但未到終點！'); playFailSound(); }
    }
    
    function showWin() {
      setStatus('success', '🎉 過關了！');
      completedLevels.add(currentLevel);
      updateLevelButtons();
      
      let stars = '⭐';
      if (blockCount <= 5) stars = '⭐⭐⭐';
      else if (blockCount <= 8) stars = '⭐⭐';
      
      document.getElementById('win-stars').textContent = stars;
      document.getElementById('score-val').textContent = stars;
      document.getElementById('win-modal').classList.add('show');
      
      playSuccessSound();
    }
    
    function playSuccessSound() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [523, 659, 784, 1047].forEach((f, i) => { setTimeout(() => { const o = ctx.createOscillator(); const g = ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value = f; g.gain.setValueAtTime(0.1, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3); o.start(); o.stop(ctx.currentTime + 0.3); }, i * 130); });
    }
    
    function playFailSound() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [300, 200].forEach((f, i) => { setTimeout(() => { const o = ctx.createOscillator(); const g = ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value = f; o.type = 'square'; g.gain.setValueAtTime(0.08, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2); o.start(); o.stop(ctx.currentTime + 0.2); }, i * 100); });
    }
    
    // ===== Level Functions =====
    function loadLevel(index) {
      currentLevel = index;
      const level = LEVELS[index];
      
      document.getElementById('level-title').textContent = level.name;
      document.getElementById('level-indicator').textContent = `Level ${index + 1} / ${LEVELS.length}`;
      
      updateLevelButtons();
      clearTrail();
      resetDroneState();
      droneNode.position = new BABYLON.Vector3(level.start.x, 0.5, level.start.z);
      dronePos = { x: level.start.x, z: level.start.z };
      
      updateGoalPosition();
      resetCamera();
      updatePositionHUD();
      
      workspace.clear();
      
      // Start tutorial for first level
      if (index === 0 && !localStorage.getItem(TUTORIAL_KEY)) {
        setTimeout(startTutorial, 800);
      }
      setStatus('ready', '準備就緒');
    }
    
    function updateLevelButtons() {
      document.querySelectorAll('.level-btn').forEach((btn, i) => {
        btn.classList.remove('active', 'completed', 'locked');
        if (i === currentLevel) btn.classList.add('active');
        else if (completedLevels.has(i)) btn.classList.add('completed');
        else if (i > currentLevel + 1) btn.classList.add('locked');
        btn.textContent = completedLevels.has(i) ? '✓' : (i + 1);
      });
    }
    
    function nextLevel() {
      document.getElementById('win-modal').classList.remove('show');
      if (currentLevel < LEVELS.length - 1) loadLevel(currentLevel + 1);
      else loadLevel(0);
    }
    
    function replayLevel() {
      document.getElementById('win-modal').classList.remove('show');
      clearTrail();
      resetDroneState();
    }
    
    function resetScene() { clearTrail(); loadLevel(currentLevel); }
    function clearBlocks() { workspace.clear(); }
    
    function showHint() {
      const level = LEVELS[currentLevel];
      const card = document.getElementById('hint-card');
      card.innerHTML = level.hint.replace(/\n/g, '<br>');
      card.classList.add('show');
      setTimeout(() => card.classList.remove('show'), 6000);
    }
    
    function showSolution() {
      const level = LEVELS[currentLevel];
      if (confirm('確定要載入解答範例嗎？')) {
        workspace.clear();
        const blocks = {};
        level.solution.forEach((type, i) => {
          const block = workspace.newBlock(type);
          block.initSvg();
          block.render();
          blocks[i] = block;
        });
        for (let i = 0; i < level.solution.length - 1; i++) {
          blocks[i].nextConnection.connect(blocks[i + 1].previousConnection);
        }
        updateBlockCount();
        setStatus('ready', '已載入解答');
      }
    }
    
    document.querySelectorAll('.level-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const level = parseInt(btn.dataset.level) - 1;
        if (!isNaN(level) && !btn.classList.contains('locked')) loadLevel(level);
      });
    });
    
    document.addEventListener('click', e => {
      if (!e.target.closest('.top-btn') && !e.target.closest('#hint-card')) {
        document.getElementById('hint-card').classList.remove('show');
      }
    });
    
    // ===== Tello Telemetry HUD =====
    function initHUD() {
      if (hudIntervalId) clearInterval(hudIntervalId);
      hudIntervalId = setInterval(updateHUD, 100);
    }
    
    function updateHUD() {
      // Battery: decreases 0.1% per second (every 100ms = 0.01%)
      telloBattery = Math.max(0, telloBattery - 0.01);
      const batteryEl = document.getElementById('hud-battery');
      const batteryRow = batteryEl.closest('.tello-row');
      batteryEl.textContent = Math.round(telloBattery) + '%';
      
      // Battery color states
      batteryRow.classList.remove('warning', 'critical');
      if (telloBattery < 20) {
        batteryRow.classList.add('critical');
      } else if (telloBattery < 40) {
        batteryRow.classList.add('warning');
      }
      
      // Height: convert Y position to cm (Y * 100)
      const heightCm = Math.round(droneY * 100);
      document.getElementById('hud-height').textContent = heightCm + ' cm';
      
      // Temperature: 28°C base + random float ±2°C
      const temp = 28 + (Math.random() * 4 - 2);
      document.getElementById('hud-temp').textContent = temp.toFixed(1) + '°C';
      
      // Flight time (mm:ss)
      if (isFlying && flightStartTime) {
        const elapsed = Math.floor((Date.now() - flightStartTime) / 1000);
        const mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
        const secs = (elapsed % 60).toString().padStart(2, '0');
        document.getElementById('hud-time').textContent = mins + ':' + secs;
      }
    }
    
    function resetTelemetry() {
      telloBattery = 100;
      telloFlightTime = 0;
      flightStartTime = null;
      document.getElementById('hud-time').textContent = '00:00';
      const batteryEl = document.getElementById('hud-battery');
      batteryEl.textContent = '100%';
      batteryEl.closest('.tello-row').classList.remove('warning', 'critical');
    }
    
    // Reposition tutorial on resize
    window.addEventListener('resize', () => {
      if (tutorialStep < TUTORIAL_STEPS.length && !tutorialDone) {
        showTutorialStep();
      }
    });
    
    window.addEventListener('load', () => {
      initBabylon();
      initBlockly();
      loadLevel(0);
      initHUD();
      
      document.body.addEventListener('click', () => {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
      }, { once: true });
    });
  </script>
</body>
</html>
