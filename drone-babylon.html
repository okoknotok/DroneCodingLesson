<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚁 無人機指令營 — 完整版</title>
  
  <!-- Babylon.js -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
  
  <!-- Blockly -->
  <script src="https://unpkg.com/blockly@11.0.0/blockly.min.js"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --motion-blue: #4A90D9;
      --looks-purple: #9B59B6;
      --control-orange: #F5A623;
      --event-yellow: #F8E71C;
      --end-red: #F56C6C;
      --bg-dark: #0d1421;
      --bg-panel: #0a1220;
      --accent: #667eea;
      --success: #50C878;
    }
    
    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }
    
    /* ===== 頂部 bar ===== */
    #top-bar {
      height: 64px;
      background: linear-gradient(135deg, var(--accent) 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      color: white;
      box-shadow: 0 4px 25px rgba(0,0,0,0.4);
      z-index: 100;
    }
    #logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #logo { font-size: 28px; }
    #level-title { font-size: 20px; font-weight: 800; }
    #level-selector {
      display: flex;
      gap: 8px;
    }
    .level-btn {
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.15);
      border: 2px solid transparent;
      border-radius: 10px;
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .level-btn:hover { background: rgba(255,255,255,0.25); }
    .level-btn.active { border-color: white; background: rgba(255,255,255,0.3); }
    .level-btn.locked { opacity: 0.4; cursor: not-allowed; }
    #top-btns { display: flex; gap: 10px; }
    .top-btn {
      padding: 8px 18px;
      background: rgba(255,255,255,0.12);
      border: none;
      border-radius: 20px;
      color: white;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .top-btn:hover { background: rgba(255,255,255,0.25); transform: translateY(-1px); }
    
    /* ===== 主內容 ===== */
    #main-content {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    
    /* ===== 左邊：3D 舞台 ===== */
    #stage-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      min-width: 0;
    }
    
    #stage-header {
      height: 50px;
      padding: 0 16px;
      background: rgba(0,0,0,0.4);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    #stage-header h3 {
      color: var(--motion-blue);
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #camera-controls { display: flex; gap: 6px; align-items: center; }
    .cam-btn {
      width: 32px; height: 32px;
      background: rgba(255,255,255,0.06);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .cam-btn:hover { background: rgba(255,255,255,0.15); }
    #cam-label { color: #666; font-size: 11px; padding: 0 6px; }
    
    #canvas-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    #renderCanvas {
      width: 100%;
      height: 100%;
      touch-action: none;
      display: block;
    }
    
    /* 疊加 UI */
    #overlay-ui {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 20;
    }
    .info-card {
      background: rgba(10, 18, 32, 0.92);
      backdrop-filter: blur(12px);
      border-radius: 14px;
      padding: 12px 16px;
      border: 1px solid rgba(255,255,255,0.08);
      min-width: 140px;
    }
    .info-card .lbl {
      color: #666;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .info-card .val {
      color: white;
      font-size: 18px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .info-card.success { border-color: var(--success); }
    .info-card .val.success { color: var(--success); }
    
    /* 終點標記 */
    #goal-hud {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(67, 160, 71, 0.9);
      padding: 10px 20px;
      border-radius: 25px;
      color: white;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(67, 160, 71, 0.4);
      animation: goalPulse 1.5s infinite;
    }
    @keyframes goalPulse {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.03); }
    }
    
    /* 過關彈窗 */
    #win-modal {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }
    #win-modal.show { display: flex; }
    #win-stars { font-size: 70px; margin-bottom: 15px; animation: starSpin 0.8s ease-out; }
    @keyframes starSpin {
      0% { transform: scale(0) rotate(-180deg); opacity: 0; }
      60% { transform: scale(1.3) rotate(20deg); }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }
    #win-modal h2 {
      color: white;
      font-size: 42px;
      margin-bottom: 8px;
      text-shadow: 0 4px 20px rgba(102, 126, 234, 0.5);
    }
    #win-modal p { color: #aaa; font-size: 20px; margin-bottom: 30px; }
    #win-buttons { display: flex; gap: 12px; }
    .win-btn {
      padding: 14px 32px;
      border: none;
      border-radius: 25px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .win-btn.primary {
      background: linear-gradient(135deg, var(--accent), #764ba2);
      color: white;
      box-shadow: 0 6px 25px rgba(102, 126, 234, 0.5);
    }
    .win-btn.secondary {
      background: rgba(255,255,255,0.1);
      color: white;
    }
    .win-btn:hover { transform: scale(1.05); }
    
    /* 提示卡片 */
    #hint-card {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(102, 126, 234, 0.95);
      padding: 16px 24px;
      border-radius: 16px;
      color: white;
      font-size: 15px;
      max-width: 400px;
      text-align: center;
      display: none;
      z-index: 50;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      line-height: 1.6;
    }
    #hint-card.show { display: block; }
    #hint-card::after {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 50%;
      transform: translateX(-50%);
      border: 10px solid transparent;
      border-top-color: rgba(102, 126, 234, 0.95);
    }
    
    /* ===== 右邊：Blockly 積木 ===== */
    #blockly-panel {
      width: 480px;
      min-width: 400px;
      background: var(--bg-panel);
      display: flex;
      flex-direction: column;
      border-left: 2px solid rgba(255,255,255,0.05);
    }
    
    #blockly-header {
      height: 56px;
      padding: 0 16px;
      background: rgba(0,0,0,0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    #blockly-header h3 {
      color: var(--accent);
      font-size: 16px;
      font-weight: 700;
    }
    #header-btns { display: flex; gap: 10px; align-items: center; }
    #block-counter {
      color: #666;
      font-size: 13px;
      padding: 6px 12px;
      background: rgba(255,255,255,0.05);
      border-radius: 15px;
    }
    #run-btn {
      padding: 10px 24px;
      background: linear-gradient(135deg, #50C878, #3cb371);
      border: none;
      border-radius: 22px;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(80, 200, 120, 0.35);
    }
    #run-btn:hover { transform: scale(1.04); }
    #run-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    #run-btn.running { background: linear-gradient(135deg, #F5A623, #e69500); }
    
    /* Blockly 區域 */
    #blockly-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    #blocklyDiv {
      flex: 1;
      height: 100%;
      overflow: auto;
    }
    
    /* Blockly 客製化 */
    .blocklyToolboxCategory {
      cursor: pointer;
    }
    
    /* 狀態列 */
    #status-bar {
      height: 44px;
      padding: 0 16px;
      background: rgba(0,0,0,0.4);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    #status-left { display: flex; gap: 16px; }
    #block-count { color: #888; font-size: 13px; }
    #level-indicator { color: #666; font-size: 12px; }
    #status-right { display: flex; align-items: center; }
    #status-badge {
      padding: 5px 14px;
      border-radius: 15px;
      font-size: 12px;
      font-weight: 700;
    }
    #status-badge.ready { background: rgba(74, 144, 217, 0.2); color: #4A90D9; }
    #status-badge.running { background: rgba(245, 166, 35, 0.2); color: #F5A623; }
    #status-badge.success { background: rgba(80, 200, 120, 0.2); color: #50C878; }
    #status-badge.fail { background: rgba(245, 108, 108, 0.2); color: #F56C6C; }
    
    /* 3D 標記 */
    #position-hud {
      position: absolute;
      bottom: 70px;
      right: 12px;
      background: rgba(10, 18, 32, 0.9);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 11px;
      color: #888;
      border: 1px solid rgba(255,255,255,0.05);
    }
    #position-hud span { color: #4A90D9; font-weight: 700; }
  </style>
</head>
<body>
  <!-- 頂部 bar -->
  <div id="top-bar">
    <div id="logo-area">
      <span id="logo">🚁</span>
      <span id="level-title">第一關：起飛着陸</span>
    </div>
    <div id="level-selector">
      <button class="level-btn active" data-level="1">1</button>
      <button class="level-btn" data-level="2">2</button>
      <button class="level-btn" data-level="3">3</button>
      <button class="level-btn" data-level="4">🔒</button>
      <button class="level-btn" data-level="5">🔒</button>
    </div>
    <div id="top-btns">
      <button class="top-btn" onclick="showHint()">💡 提示</button>
      <button class="top-btn" onclick="resetScene()">🔄 重置</button>
      <button class="top-btn" onclick="clearBlocks()">🗑️ 清除</button>
    </div>
  </div>
  
  <div id="main-content">
    <!-- 左邊：3D 舞台 -->
    <div id="stage-panel">
      <div id="stage-header">
        <h3>🎮 遊戲舞台 <span id="cam-label">100%</span></h3>
        <div id="camera-controls">
          <button class="cam-btn" onclick="cameraZoom(1.2)">＋</button>
          <button class="cam-btn" onclick="cameraZoom(0.8)">－</button>
          <button class="cam-btn" onclick="resetCamera()">⟲</button>
          <button class="cam-btn" onclick="toggleFullscreen()">⛶</button>
        </div>
      </div>
      
      <div id="canvas-wrapper">
        <canvas id="renderCanvas"></canvas>
        
        <!-- 疊加 UI -->
        <div id="overlay-ui">
          <div class="info-card">
            <div class="lbl">無人機</div>
            <div class="val" id="drone-state">😴 待機</div>
          </div>
          <div class="info-card">
            <div class="lbl">積木數量</div>
            <div class="val" id="block-num">0</div>
          </div>
          <div class="info-card" id="score-card">
            <div class="lbl">評分</div>
            <div class="val" id="score-val">☆☆☆</div>
          </div>
        </div>
        
        <div id="goal-hud">🏁 終點</div>
        <div id="position-hud">X: <span id="pos-x">0</span> Z: <span id="pos-z">0</span></div>
        
        <!-- 過關彈窗 -->
        <div id="win-modal">
          <div id="win-stars">⭐⭐⭐</div>
          <h2 id="win-title">過關了！</h2>
          <p id="win-msg">太棒了！準備好挑戰下一關？</p>
          <div id="win-buttons">
            <button class="win-btn secondary" onclick="replayLevel()">再玩一次</button>
            <button class="win-btn primary" onclick="nextLevel()">下一關 →</button>
          </div>
        </div>
        
        <div id="hint-card"></div>
      </div>
    </div>
    
    <!-- 右邊：Blockly -->
    <div id="blockly-panel">
      <div id="blockly-header">
        <h3>🧩 積木程式</h3>
        <div id="header-btns">
          <span id="block-counter">0 個積木</span>
          <button id="run-btn" onclick="runProgram()">▶ 執行</button>
        </div>
      </div>
      
      <div id="blockly-area">
        <div id="blocklyDiv"></div>
      </div>
      
      <div id="status-bar">
        <div id="status-left">
          <span id="block-count">0 個積木</span>
          <span id="level-indicator">Level 1 / 5</span>
        </div>
        <div id="status-right">
          <span id="status-badge" class="ready">準備就緒</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Blockly 工具箱 -->
  <xml id="toolbox" style="display: none">
    <category name="🚀 移動" colour="#4A90D9">
      <block type="drone_takeoff"></block>
      <block type="drone_forward">
        <value name="STEPS">
          <shadow type="math_number">
            <field name="NUM">1</field>
          </shadow>
        </value>
      </block>
      <block type="drone_backward">
        <value name="STEPS">
          <shadow type="math_number">
            <field name="NUM">1</field>
          </shadow>
        </value>
      </block>
      <block type="drone_left_turn"></block>
      <block type="drone_right_turn"></block>
    </category>
    <category name="🎯 控制" colour="#F5A623">
      <block type="drone_wait">
        <value name="SECONDS">
          <shadow type="math_number">
            <field name="NUM">1</field>
          </shadow>
        </value>
      </block>
      <block type="drone_repeat">
        <value name="TIMES">
          <shadow type="math_number">
            <field name="NUM">3</field>
          </shadow>
        </value>
      </block>
      <block type="drone_if"></block>
    </category>
    <category name="🎬 外觀" colour="#9B59B6">
      <block type="drone_led_green"></block>
      <block type="drone_led_red"></block>
      <block type="drone_led_yellow"></block>
    </category>
    <category name="🏁 結束" colour="#F56C6C">
      <block type="drone_land"></block>
      <block type="drone_stop"></block>
    </category>
  </xml>

  <script>
    // ===== 全域變數 =====
    let canvas, engine, scene, camera;
    let droneNode, droneMeshes = [];
    let groundMesh, goalMesh;
    let shadowGenerator = null;
    
    let dronePos = { x: 0, z: 0 };
    let droneY = 0.5;
    let droneDirection = 0; // 0=+Z, 90=+X, 180=-Z, 270=-X
    let isFlying = false;
    let isExecuting = false;
    let currentLevel = 0;
    let blockCount = 0;
    
    let zoomLevel = 100;
    
    // ===== 關卡數據 =====
    const LEVELS = [
      {
        name: "第一關：起飛着陸",
        hint: "🎯 目標：讓無人機起飛，前進 3 格，然後着陸！\n\n💡 提示：起飛 → 前進 × 3 → 着陸",
        start: { x: -6, z: 0 },
        goal: { x: 3, z: 0 },
        cameraPos: { alpha: -Math.PI / 2, beta: Math.PI / 3, radius: 18 }
      },
      {
        name: "第二關：轉向前進",
        hint: "🎯 目標：L 形路線，先前進再左轉，然後着陸\n\n💡 提示：起飛 → 前進 → 左轉 → 前進 → 着陸",
        start: { x: -6, z: 4 },
        goal: { x: -2, z: -4 },
        cameraPos: { alpha: -Math.PI / 2.5, beta: Math.PI / 3.5, radius: 20 }
      },
      {
        name: "第三關：正方形",
        hint: "🎯 目標：走正方形路線回到起點附近\n\n💡 提示：前進 → 右轉 × 3（正方形）→ 着陸",
        start: { x: 0, z: 4 },
        goal: { x: 0, z: 4 },
        cameraPos: { alpha: -Math.PI / 2, beta: Math.PI / 4, radius: 22 }
      },
      {
        name: "第四關：長距離",
        hint: "🎯 目標：穿越整個客廳到終點\n\n💡 提示：使用「重複」積木減少積木數量",
        start: { x: -8, z: 0 },
        goal: { x: 8, z: 0 },
        cameraPos: { alpha: -Math.PI / 2, beta: Math.PI / 3, radius: 25 }
      },
      {
        name: "第五關：迷宮挑戰",
        hint: "🎯 目標：繞過障礙物到達終點\n\n💡 提示：需要多次轉向來繞過障礙",
        start: { x: -7, z: 5 },
        goal: { x: 7, z: -5 },
        cameraPos: { alpha: -Math.PI / 1.8, beta: Math.PI / 3.5, radius: 24 }
      }
    ];
    
    // ===== Blockly 積木定義 =====
    function defineBlocks() {
      // 起飛
      Blockly.Blocks['drone_takeoff'] = {
        init: function() {
          this.appendDummyInput().appendField('🚀 起飛');
          this.setPreviousStatement(true, null);
          this.setNextStatement(true, null);
          this.setColour('#4A90D9');
          this.setTooltip('讓無人機起飛到空中');
        }
      };
      
      // 前進
      Blockly.Blocks['drone_forward'] = {
        init: function() {
          this.appendValueInput('STEPS').appendField('⬆️ 前進').setCheck('Number');
          this.setInputsInline(true);
          this.setPreviousStatement(true, null);
          this.setNextStatement(true, null);
          this.setColour('#4A90D9');
        }
      };
      
      // 後退
      Blockly.Blocks['drone_backward'] = {
        init: function() {
          this.appendValueInput('STEPS').appendField('⬇️ 後退').setCheck('Number');
          this.setInputsInline(true);
          this.setPreviousStatement(true, null);
          this.setNextStatement(true, null);
          this.setColour('#4A90D9');
        }
      };
      
      // 左轉
      Blockly.Blocks['drone_left_turn'] = {
        init: function() {
          this.appendDummyInput().appendField('↩️ 左轉 90°');
          this.setPreviousStatement(true, null);
          this.setNextStatement(true, null);
          this.setColour('#4A90D9');
        }
      };
      
      // 右轉
      Blockly.Blocks['drone_right_turn'] = {
        init: function() {
          this.appendDummyInput().appendField('↪️ 右轉 90°');
          this.setPreviousStatement(true, null);
          this.setNextStatement(true, null);
          this.setColour('#4A90D9');
        }
      };
      
      // 等待
      Blockly.Blocks['drone_wait'] = {
        init: function() {
          this.appendValueInput('SECONDS').appendField('⏱️ 等待').setCheck('Number');
          this.setInputsInline(true);
          this.setPreviousStatement(true, null);
          this.setNextStatement(true, null);
          this.setColour('#F5A623');
        }
      };
      
      // 重複
      Blockly.Blocks['drone_repeat'] = {
        init: function() {
          this.appendValueInput('TIMES').appendField('🔄 重複').setCheck('Number');
          this.appendStatementInput('DO');
          this.setInputsInline(true);
          this.setPreviousStatement(true, null);
          this.setNextStatement(true, null);
          this.setColour('#F5A623');
        }
      };
      
      // 條件
      Blockly.Blocks['drone_if'] = {
        init: function() {
          this.appendDummyInput().appendField('⚠️ 如果前方有障礙');
          this.appendStatementInput('DO');
          this.setPreviousStatement(true, null);
          this.setNextStatement(true, null);
          this.setColour('#F5A623');
        }
      };
      
      // LED 綠
      Blockly.Blocks['drone_led_green'] = {
        init: function() {

    // ===== Babylon.js 初始化 =====
    function initBabylon() {
      canvas = document.getElementById('renderCanvas');
      engine = new BABYLON.Engine(canvas, true, { 
        preserveDrawingBuffer: true, 
        stencil: true,
        antialias: true
      });
      
      scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0.04, 0.08, 0.13, 1);
      
      // 攝影機
      camera = new BABYLON.ArcRotateCamera('cam', -Math.PI / 2, Math.PI / 3, 18, BABYLON.Vector3.Zero(), scene);
      camera.attachControl(canvas, true);
      camera.lowerRadiusLimit = 8;
      camera.upperRadiusLimit = 50;
      camera.lowerBetaLimit = 0.2;
      camera.upperBetaLimit = Math.PI / 2.1;
      camera.wheelPrecision = 30;
      camera.pinchPrecision = 50;
      
      // 半球光
      const hemi = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0, 1, 0), scene);
      hemi.intensity = 0.5;
      hemi.groundColor = new BABYLON.Color3(0.15, 0.15, 0.2);
      
      // 方向光
      const dirLight = new BABYLON.DirectionalLight('dir', new BABYLON.Vector3(-1, -2, -1), scene);
      dirLight.intensity = 0.9;
      dirLight.position = new BABYLON.Vector3(10, 20, 10);
      
      // 陰影
      shadowGenerator = new BABYLON.ShadowGenerator(1024, dirLight);
      shadowGenerator.useBlurExponentialShadowMap = true;
      shadowGenerator.blurKernel = 32;
      
      // 建立場景
      createRoom();
      createDrone();
      createGoal();
      
      // 渲染循環
      engine.runRenderLoop(() => scene.render());
      
      // 視窗調整
      window.addEventListener('resize', () => engine.resize());
    }
    
    // ===== 建立房間 =====
    function createRoom() {
      // 地板
      groundMesh = BABYLON.MeshBuilder.CreateGround('floor', { width: 28, height: 20 }, scene);
      const floorMat = new BABYLON.StandardMaterial('floorMat', scene);
      
      // 地板紋理
      const floorTex = new BABYLON.DynamicTexture('floorTex', { width: 1024, height: 1024 }, scene);
      const ctx = floorTex.getContext();
      
      // 木地板圖案
      ctx.fillStyle = '#8B7355';
      ctx.fillRect(0, 0, 1024, 1024);
      
      for (let i = 0; i < 14; i++) {
        ctx.strokeStyle = '#7a6348';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(i * 73, 0);
        ctx.lineTo(i * 73, 1024);
        ctx.stroke();
        
        // 木紋
        ctx.strokeStyle = 'rgba(90, 70, 50, 0.15)';
        ctx.lineWidth = 1;
        for (let j = 0; j < 8; j++) {
          ctx.beginPath();
          ctx.moveTo(i * 73, j * 128);
          ctx.lineTo((i + 1) * 73, j * 128 + 20);
          ctx.stroke();
        }
      }
      floorTex.update();
      
      floorMat.diffuseTexture = floorTex;
      floorMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
      groundMesh.material = floorMat;
      groundMesh.receiveShadows = true;
      
      // 牆壁
      const wallMat = new BABYLON.StandardMaterial('wallMat', scene);
      wallMat.diffuseColor = new BABYLON.Color3(0.55, 0.75, 0.85);
      wallMat.alpha = 0.25;
      wallMat.backFaceCulling = false;
      
      const wallHeight = 10;
      
      // 後牆
      const backWall = BABYLON.MeshBuilder.CreatePlane('backWall', { width: 28, height: wallHeight }, scene);
      backWall.position = new BABYLON.Vector3(0, wallHeight / 2, -10);
      backWall.material = wallMat;
      
      // 左牆
      const leftWall = BABYLON.MeshBuilder.CreatePlane('leftWall', { width: 20, height: wallHeight }, scene);
      leftWall.position = new BABYLON.Vector3(-14, wallHeight / 2, 0);
      leftWall.rotation.y = Math.PI / 2;
      leftWall.material = wallMat;
      
      // 右牆
      const rightWall = BABYLON.MeshBuilder.CreatePlane('rightWall', { width: 20, height: wallHeight }, scene);
      rightWall.position = new BABYLON.Vector3(14, wallHeight / 2, 0);
      rightWall.rotation.y = -Math.PI / 2;
      rightWall.material = wallMat;
      
      // 家具
      createFurniture();
    }

        propMat.diffuseColor = new BABYLON.Color3(0.8, 0.85, 0.9);

        prop.material = propMat;
        droneMeshes.push(prop);
      });

    // ===== 執行積木程式 =====
    async function runProgram() {
      if (isExecuting) return;
      
      const allBlocks = workspace.getAllBlocks();
      if (allBlocks.length === 0) {
        setStatus('fail', '請先加入積木！');
        return;
      }
      
      isExecuting = true;
      document.getElementById('run-btn').classList.add('running');
      document.getElementById('run-btn').disabled = true;
      setStatus('running', '🔄 執行中...');
      
      resetDroneState();
      
      // 收集所有積木並按順序執行
      const blocksToExecute = [];
      const visited = new Set();
      
      // 按順序遍歷所有積木（跟隨連接鏈）
      function collectBlocks(block) {
        if (!block || visited.has(block.id)) return;
        visited.add(block.id);
        blocksToExecute.push(block);
        
        // 檢查下一個連接的積木
        const nextBlock = block.getNextBlock();
        if (nextBlock) collectBlocks(nextBlock);
      }
      
      // 從每個頂部積木開始收集
      const topBlocks = workspace.getTopBlocks();
      topBlocks.forEach(block => collectBlocks(block));
      
      // 執行所有積木
      for (const block of blocksToExecute) {
        await executeBlock(block);
      }
      
      isExecuting = false;
      document.getElementById('run-btn').classList.remove('running');
      document.getElementById('run-btn').disabled = false;
      
      checkGoal();
    }
    
    function resetDroneState() {
      const level = LEVELS[currentLevel];
      droneNode.position = new BABYLON.Vector3(level.start.x, 0.5, level.start.z);
      droneNode.rotation = BABYLON.Vector3.Zero();
      dronePos = { x: level.start.x, z: level.start.z };
      droneY = 0.5;
      droneDirection = 0;
      isFlying = false;
      updateDroneUI('😴', '待機');
    }
    
    async function executeBlock(block) {
      if (!block.isEnabled()) return;
      
      const type = block.type;
      let steps = 1;
      let seconds = 1;
      
      // 獲取參數
      switch (type) {
        case 'drone_forward':
        case 'drone_backward':
          const stepsBlock = block.getInput('STEPS')?.connection?.targetBlock();
          if (stepsBlock?.getFieldValue) {
            steps = Math.max(1, Math.min(10, parseInt(stepsBlock.getFieldValue('NUM')) || 1));
          }
          break;
        case 'drone_wait':
          const secBlock = block.getInput('SECONDS')?.connection?.targetBlock();
          if (secBlock?.getFieldValue) {
            seconds = Math.max(0.5, Math.min(5, parseFloat(secBlock.getFieldValue('NUM')) || 1));
          }
          break;
        case 'drone_repeat':
          const timesBlock = block.getInput('TIMES')?.connection?.targetBlock();
          if (timesBlock?.getFieldValue) {
            steps = Math.max(1, Math.min(10, parseInt(timesBlock.getFieldValue('NUM')) || 1));
          }
          break;
      }
      
      // 執行動作
      switch (type) {
        case 'drone_takeoff':
          await animateTakeoff();
          break;
        case 'drone_forward':
          for (let i = 0; i < steps; i++) {
            await animateMove(1);
          }
          break;
        case 'drone_backward':
          for (let i = 0; i < steps; i++) {
            await animateMove(-1);
          }
          break;
        case 'drone_left_turn':
          await animateTurn(-90);
          break;
        case 'drone_right_turn':
          await animateTurn(90);
          break;
        case 'drone_wait':
          await delay(seconds * 500);
          break;
        case 'drone_land':
          await animateLand();
          break;
        case 'drone_repeat':
          const childBlock = block.getInput('DO')?.connection?.targetBlock();
          if (childBlock) {
            for (let i = 0; i < steps; i++) {
              await executeBlock(childBlock);
            }
          }
          break;
        case 'drone_led_green':
          setLEDColor(0.2, 0.9, 0.3);
          break;
        case 'drone_led_red':
          setLEDColor(0.9, 0.2, 0.2);
          break;
        case 'drone_led_yellow':
          setLEDColor(0.9, 0.9, 0.2);
          break;
        case 'drone_stop':
          isExecuting = false;
          break;
      }
      
      updatePositionHUD();
    }
    
    async function animateTakeoff() {
      if (!isFlying) {
        isFlying = true;
        updateDroneUI('😀', '起飛中');
        
        const startY = droneY;
        const targetY = 2.5;
        const duration = 700;
        const startTime = Date.now();
        
        return new Promise(resolve => {
          function animate() {
            const t = Math.min((Date.now() - startTime) / duration, 1);
            const eased = 1 - Math.pow(1 - t, 3);
            
            droneY = startY + (targetY - startY) * eased;
            droneNode.position.y = droneY;
            
            // 輕微晃動
            droneNode.rotation.x = Math.sin(t * 20) * 0.015;
            droneNode.rotation.z = Math.cos(t * 15) * 0.015;
            
            if (t < 1) requestAnimationFrame(animate);
            else {
              droneNode.rotation = BABYLON.Vector3.Zero();
              resolve();
            }
          }
          animate();
        });
      }
    }
    
    async function animateMove(dir) {
      if (!isFlying) await animateTakeoff();
      
      updateDroneUI('😎', '移動中');
      
      const rad = droneDirection * Math.PI / 180;
      const dx = Math.cos(rad) * dir * 1.5;
      const dz = Math.sin(rad) * dir * 1.5;
      
      const startX = dronePos.x;
      const startZ = dronePos.z;
      const targetX = startX + dx;
      const targetZ = startZ + dz;
      
      const duration = 400;
      const startTime = Date.now();
      
      return new Promise(resolve => {
        function animate() {
          const t = Math.min((Date.now() - startTime) / duration, 1);
          const eased = 1 - Math.pow(1 - t, 2);
          
          dronePos.x = startX + (targetX - startX) * eased;
          dronePos.z = startZ + (targetZ - startZ) * eased;
          droneNode.position.x = dronePos.x;
          droneNode.position.z = dronePos.z;
          
          if (t < 1) requestAnimationFrame(animate);
          else {
            dronePos.x = targetX;
            dronePos.z = targetZ;
            resolve();
          }
        }
        animate();
      });
    }
    
    async function animateTurn(angle) {
      if (!isFlying) await animateTakeoff();
      
      updateDroneUI('😉', '轉向中');
      
      const startRot = droneDirection;
      const targetRot = (droneDirection + angle + 360) % 360;
      const startYRot = droneNode.rotation.y;
      const targetYRot = angle * Math.PI / 180;
      
      const duration = 350;
      const startTime = Date.now();
      
      return new Promise(resolve => {
        function animate() {
          const t = Math.min((Date.now() - startTime) / duration, 1);
          const eased = 1 - Math.pow(1 - t, 2);
          
          droneNode.rotation.y = startYRot + (targetYRot - startYRot) * eased;
          
          if (t < 1) requestAnimationFrame(animate);
          else {
            droneDirection = targetRot;
            droneNode.rotation.y = targetYRot;
            resolve();
          }
        }
        animate();
      });
    }
    
    async function animateLand() {
      isFlying = false;
      updateDroneUI('🥰', '降落中');
      
      const startY = droneY;
      const targetY = 0.5;
      const duration = 700;
      const startTime = Date.now();
      
      return new Promise(resolve => {
        function animate() {
          const t = Math.min((Date.now() - startTime) / duration, 1);
          const eased = t * t;
          
          droneY = startY + (targetY - startY) * eased;
          droneNode.position.y = droneY;
          
          if (t < 1) requestAnimationFrame(animate);
          else {
            droneY = targetY;
            droneNode.position.y = targetY;
            resolve();
          }
        }
        animate();
      });
    }
    
    function setLEDColor(r, g, b) {
      droneMeshes.forEach(mesh => {
        if (mesh.name === 'led' && mesh.material) {
          mesh.material.emissiveColor = new BABYLON.Color3(r, g, b);
          mesh.material.diffuseColor = new BABYLON.Color3(r, g, b);
        }
      });
    }
    
    function delay(ms) {
      return new Promise(r => setTimeout(r, ms));
    }
    
    // ===== UI 更新 =====
    function updateDroneUI(expr, text) {
      document.getElementById('drone-state').textContent = `${expr} ${text}`;
    }
    
    function updatePositionHUD() {
      document.getElementById('pos-x').textContent = dronePos.x.toFixed(1);
      document.getElementById('pos-z').textContent = dronePos.z.toFixed(1);
    }
    
    function setStatus(type, msg) {
      const badge = document.getElementById('status-badge');
      badge.className = type;
      badge.textContent = msg;
    }
    
    function checkGoal() {
      const level = LEVELS[currentLevel];
      const dx = Math.abs(dronePos.x - level.goal.x);
      const dz = Math.abs(dronePos.z - level.goal.z);
      
      if (dx < 1.8 && dz < 1.8) {
        showWin();
      } else if (isFlying) {
        setStatus('fail', '❌ 未到達終點！');
        playFailSound();
      }
    }
    
    function showWin() {
      setStatus('success', '🎉 過關了！');
      
      // 計算星星
      let stars = '⭐';
      if (blockCount <= 5) stars = '⭐⭐⭐';
      else if (blockCount <= 8) stars = '⭐⭐';
      
      document.getElementById('win-stars').textContent = stars;
      document.getElementById('score-val').textContent = stars;
      document.getElementById('win-modal').classList.add('show');
      
      playSuccessSound();
    }
    
    function playSuccessSound() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [523, 659, 784, 1047].forEach((f, i) => {
        setTimeout(() => {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.connect(g);
          g.connect(ctx.destination);
          o.frequency.value = f;
          g.gain.setValueAtTime(0.1, ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          o.start();
          o.stop(ctx.currentTime + 0.3);
        }, i * 130);
      });
    }
    
    function playFailSound() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [300, 200].forEach((f, i) => {
        setTimeout(() => {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.connect(g);
          g.connect(ctx.destination);
          o.frequency.value = f;
          o.type = 'square';
          g.gain.setValueAtTime(0.08, ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
          o.start();
          o.stop(ctx.currentTime + 0.2);
        }, i * 100);
      });
    }
    
    // ===== 關卡控制 =====
    function loadLevel(index) {
      currentLevel = index;
      const level = LEVELS[index];
      
      document.getElementById('level-title').textContent = level.name;
      document.getElementById('level-indicator').textContent = `Level ${index + 1} / ${LEVELS.length}`;
      
      // 更新關卡按鈕
      document.querySelectorAll('.level-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === index);
        if (i > index + 1) btn.classList.add('locked');
      });
      
      // 重置場景
      resetDroneState();
      droneNode.position = new BABYLON.Vector3(level.start.x, 0.5, level.start.z);
      dronePos = { x: level.start.x, z: level.start.z };
      
      updateGoalPosition();
      resetCamera();
      updatePositionHUD();
      
      // 清空積木
      workspace.clear();
      
      setStatus('ready', '準備就緒');
    }
    
    function nextLevel() {
      document.getElementById('win-modal').classList.remove('show');
      if (currentLevel < LEVELS.length - 1) {
        loadLevel(currentLevel + 1);
      } else {
        loadLevel(0);
      }
    }
    
    function replayLevel() {
      document.getElementById('win-modal').classList.remove('show');
      resetDroneState();
    }
    
    function resetScene() {
      loadLevel(currentLevel);
    }
    
    function clearBlocks() {
      workspace.clear();
    }
    
    function showHint() {
      const level = LEVELS[currentLevel];
      const card = document.getElementById('hint-card');
      card.innerHTML = level.hint.replace(/\n/g, '<br>');
      card.classList.add('show');
      
      setTimeout(() => card.classList.remove('show'), 6000);
    }
    
    // 關卡選擇
    document.querySelectorAll('.level-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const level = parseInt(btn.dataset.level) - 1;
        if (!isNaN(level) && level <= currentLevel + 1) {
          loadLevel(level);
        }
      });
    });
    
    // 點擊其他地方關閉提示
    document.addEventListener('click', e => {
      if (!e.target.closest('.top-btn') && !e.target.closest('#hint-card')) {
        document.getElementById('hint-card').classList.remove('show');
      }
    });
    
    // 初始化
    window.addEventListener('load', () => {
      initBabylon();
      initBlockly();
      loadLevel(0);
      
      document.body.addEventListener('click', () => {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
      }, { once: true });
    });
  </script>
</body>
</html>
